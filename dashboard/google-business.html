<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Business Profile - Tapify</title>
    <link rel="icon" type="image/png" href="../images/tapify-logo-green.png">
    <link rel="preconnect" href="https://app.tapify.co.in" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../admin-style.css">
    <style>
        .gb { max-width: 1100px; margin: 20px auto; padding: 0 20px 48px; }

        .gb-bar {
            background: #fff; border: 1px solid #e9e3dc; border-radius: 15px;
            padding: 15px 18px; display: flex; align-items: center; gap: 14px;
            flex-wrap: wrap; margin-bottom: 16px;
        }
        .gb-dot { width: 10px; height: 10px; border-radius: 50%; background: #d1d5db; flex: 0 0 auto; }
        .gb-dot.on { background: #16a34a; }
        .gb-where { flex: 1; min-width: 200px; }
        .gb-where b { color: #153e3f; font-size: .95rem; }
        .gb-where p { margin: 2px 0 0; font-size: .78rem; color: #6b7280; }

        .gb-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
        .gb-tab {
            border: 1px solid #e9e3dc; background: #fff; color: #6b7280; cursor: pointer;
            padding: 8px 15px; border-radius: 20px; font: inherit; font-size: .82rem; font-weight: 700;
        }
        .gb-tab.on { background: #153e3f; border-color: #153e3f; color: #fff; }

        .card { background: #fff; border: 1px solid #e9e3dc; border-radius: 15px; padding: 18px; margin-bottom: 14px; }
        .card h3 { margin: 0 0 12px; font-size: .95rem; font-weight: 800; color: #153e3f; }

        .btn { background: #153e3f; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px;
               font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer; text-decoration: none;
               display: inline-block; }
        .btn:disabled { opacity: .5; cursor: default; }
        .btn-ghost { background: none; color: #153e3f; border: 1px solid #153e3f; }
        .btn-sm { padding: 7px 13px; font-size: .78rem; }

        .inp, .ta, .sel {
            width: 100%; border: 1px solid #e9e3dc; border-radius: 10px; padding: 10px 12px;
            font: inherit; font-size: .88rem; background: #fff;
        }
        .ta { min-height: 92px; resize: vertical; }
        .lbl { display: block; font-size: .72rem; font-weight: 700; color: #6b7280;
               text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 5px; }

        .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .stat { background: #faf7f4; border-radius: 12px; padding: 14px; text-align: center; }
        .stat b { display: block; font-size: 1.5rem; color: #153e3f; }
        .stat span { font-size: .72rem; color: #6b7280; font-weight: 600; }

        .rev { border-bottom: 1px solid #f0ece6; padding: 14px 0; }
        .rev:last-child { border-bottom: 0; }
        .rev-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
        .rev-who { font-weight: 700; color: #153e3f; font-size: .88rem; }
        .rev-when { font-size: .72rem; color: #9ca3af; }
        .rev-stars { color: #f59e0b; font-size: .82rem; letter-spacing: 1px; }
        .rev-txt { font-size: .85rem; color: #374151; line-height: 1.5; margin: 6px 0 0; }
        .rev-reply { background: #f6f9f8; border-left: 3px solid #27706e; padding: 9px 12px;
                     border-radius: 0 8px 8px 0; margin-top: 9px; font-size: .82rem; color: #374151; }
        .rev-reply b { color: #153e3f; display: block; font-size: .72rem; margin-bottom: 2px; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { border: 1px solid #e9e3dc; background: #fff; border-radius: 20px; padding: 7px 13px;
                font-size: .8rem; cursor: pointer; font-weight: 600; color: #374151; }
        .chip.on { background: #153e3f; border-color: #153e3f; color: #fff; }

        /* Marketing score — the same gauge + fix-list the app shows on its
           AI Growth Center screen, which is where the score lives there. */
        .sc-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
        .gauge { position: relative; width: 112px; height: 112px; flex: 0 0 auto; border-radius: 50%; }
        .gauge i { position: absolute; inset: 11px; background: #fff; border-radius: 50%;
                   display: flex; flex-direction: column; align-items: center; justify-content: center;
                   font-style: normal; }
        .gauge b { font-size: 1.7rem; font-weight: 800; color: #153e3f; line-height: 1; }
        .gauge s { text-decoration: none; font-size: .64rem; font-weight: 700; color: #9ca3af;
                   text-transform: uppercase; letter-spacing: .6px; margin-top: 3px; }
        .sc-sum { flex: 1; min-width: 210px; font-size: .86rem; color: #374151; line-height: 1.55; }
        .sc-band { display: inline-block; font-size: .7rem; font-weight: 800; text-transform: uppercase;
                   letter-spacing: .6px; padding: 3px 10px; border-radius: 20px; margin-bottom: 7px; }
        .sc-grp { font-size: .7rem; font-weight: 800; color: #9ca3af; text-transform: uppercase;
                  letter-spacing: .6px; margin: 16px 0 6px; }
        .sc-it { display: flex; align-items: center; gap: 10px; padding: 9px 0;
                 border-bottom: 1px solid #f0ece6; }
        .sc-it:last-child { border-bottom: 0; }
        .sc-tick { width: 20px; height: 20px; border-radius: 50%; flex: 0 0 auto; font-size: .66rem;
                   display: flex; align-items: center; justify-content: center; font-weight: 800; }
        .sc-tick.on { background: #dcfce7; color: #15803d; }
        .sc-tick.off { background: #f3f4f6; color: #9ca3af; }
        .sc-lbl { flex: 1; min-width: 0; font-size: .84rem; color: #374151; }
        .sc-pts { font-size: .72rem; font-weight: 700; color: #9ca3af; white-space: nowrap; }

        .fld { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: center;
               padding: 9px 0; border-bottom: 1px solid #f0ece6; font-size: .85rem; }
        .fld:last-child { border-bottom: 0; }
        .fld span { font-size: .72rem; font-weight: 700; color: #9ca3af;
                    text-transform: uppercase; letter-spacing: .5px; }
        @media (max-width: 620px) { .fld { grid-template-columns: 1fr; gap: 3px; } }

        .ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .ph-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px;
                       border: 1px solid #e9e3dc; display: block; }

        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .grow { flex: 1; min-width: 150px; }
        .muted { color: #9ca3af; font-size: .85rem; }
        .warn { background: #fdf6e7; border: 1px solid #e3c178; border-radius: 11px;
                padding: 12px 14px; font-size: .83rem; color: #6b5420; line-height: 1.5; }
        .err  { background: #fdecec; border: 1px solid #e9a0a0; border-radius: 11px;
                padding: 12px 14px; font-size: .83rem; color: #8a2a2a; line-height: 1.5; }
        .hide { display: none !important; }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header">
            <a href="dashboard" class="sidebar-logo">
                <img src="../images/tapify-logo-green.png" alt="Tapify">
            </a>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard" class="nav-item"><i class="fas fa-chart-pie nav-icon"></i><span>Dashboard</span></a>
            <a href="profile" class="nav-item"><i class="fas fa-user nav-icon"></i><span>My Profile</span></a>
            <a href="lead-extractor" class="nav-item"><i class="fas fa-magnifying-glass-location nav-icon" style="color:#0f766e"></i><span>Lead Extractor</span></a>
            <a href="social" class="nav-item"><i class="fas fa-bullhorn nav-icon" style="color:#e1306c"></i><span>Social Media</span></a>
            <a href="link-pages" class="nav-item"><i class="fas fa-link nav-icon" style="color:#0ea5e9"></i><span>Link Page</span></a>
            <a href="my-designs" class="nav-item"><i class="fas fa-palette nav-icon" style="color:#f59e0b"></i><span>My Designs</span></a>
            <a href="google-business" class="nav-item active"><i class="fab fa-google nav-icon" style="color:#4285F4"></i><span>Google Business</span></a>
            <a href="website-builder" class="nav-item"><i class="fas fa-globe nav-icon"></i><span>Website Builder</span></a>
            <a href="whatsapp" class="nav-item"><i class="fab fa-whatsapp nav-icon" style="color:#25D366"></i><span>WhatsApp</span></a>
            <a href="site-orders" class="nav-item"><i class="fas fa-receipt nav-icon"></i><span>Orders</span></a>
            <a href="site-inquiries" class="nav-item"><i class="fas fa-envelope-open-text nav-icon"></i><span>Inquiries</span></a>
            <a href="site-feedback" class="nav-item" data-feature="feedback" style="display:none"><i class="fas fa-star nav-icon"></i><span>Feedback</span></a>
            <a href="site-appointments" class="nav-item"><i class="fas fa-calendar-day nav-icon"></i><span>Appointments</span></a>
            <a href="manage-subscription?tab=gateway" class="nav-item"><i class="fas fa-credit-card nav-icon" style="color:#16a34a"></i><span>Payment Gateway</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="manage-subscription" class="subscription-btn"><i class="fas fa-gem"></i><span>Manage Subscription</span></a>
            <a href="#" onclick="logout()" class="nav-item text-danger"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
        </div>
    </aside>

    <div class="admin-main" id="adminMain">
        <header class="admin-header">
            <div class="header-left">
                <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 class="page-title">Google Business Profile</h1>
            </div>
            <div class="header-right">
                <button class="btn-new-vcard" onclick="boot()"><i class="fas fa-rotate"></i> Refresh</button>
            </div>
        </header>

        <main class="page-content">
            <div class="gb">
                <div id="flash"></div>
                <div id="bar"></div>
                <div class="gb-tabs hide" id="tabs"></div>
                <div id="panel"></div>
            </div>
        </main>
    </div>

    <script src="../admin.js"></script>
    <script>
    const API = 'https://app.tapify.co.in';

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    async function api(path, opts) {
        const r = await fetch(API + '/api/google/gbp/' + path, Object.assign({
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
        }, opts || {}));
        const j = await r.json().catch(() => ({}));
        if (!j.success) throw new Error(j.message || ('Request failed (' + r.status + ')'));
        return j.data || {};
    }

    const TABS = [
        ['score',      'Score'],
        ['info',       'Business info'],
        ['reviews',    'Reviews'],
        ['posts',      'Posts'],
        ['photos',     'Photos'],
        ['insights',   'Insights'],
        ['services',   'Services'],
        ['attributes', 'Attributes'],
        ['ask',        'Get reviews'],
        // The review funnel used to be its own sidebar page. It belongs here:
        // a negative review and the listing it would have landed on are the
        // same job, and bouncing between two pages to handle one complaint is
        // how they get missed. reviews.html still works for old bookmarks.
        ['funnel',     'Review funnel'],
    ];
    let tab = 'score';
    let status = null;

    /* ───────────────────────────── connection bar ───────────────────── */

    async function boot() {
        // A ?status= on the URL means we have just come back from Google's
        // consent screen (see callback.php), so say what happened before the
        // page quietly reloads the connection underneath.
        const q = new URLSearchParams(location.search);
        if (q.get('status')) {
            document.getElementById('flash').innerHTML = q.get('status') === 'success'
                ? '<div class="card" style="border-color:#9ccfae;background:#f1faf4">Google Business Profile connected.</div>'
                : '<div class="err">Could not connect to Google (' + esc(q.get('reason') || 'unknown') + '). Please try again.</div>';
            history.replaceState({}, '', location.pathname);
        }

        try {
            status = await api('status.php');
        } catch (e) {
            document.getElementById('bar').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
            return;
        }
        renderBar();

        if (status.connected && status.location) {
            document.getElementById('tabs').classList.remove('hide');
            renderTabs();
            openTab(tab);
        } else {
            document.getElementById('tabs').classList.add('hide');
            document.getElementById('panel').innerHTML = status.connected
                ? ''                       // connected but no location → picker is in the bar
                : '<div class="card"><p class="muted">Connect your Google Business Profile to manage '
                  + 'reviews, posts, services and insights from here.</p></div>';
            if (status.connected && !status.location) loadLocations();
        }
    }

    function renderBar() {
        if (!status.configured) {
            document.getElementById('bar').innerHTML =
                '<div class="warn">Google Business Profile is not switched on for this account yet. '
                + 'Please contact Tapify support.</div>';
            return;
        }
        if (!status.connected) {
            document.getElementById('bar').innerHTML = `
                <div class="gb-bar">
                    <span class="gb-dot"></span>
                    <div class="gb-where"><b>Not connected</b>
                        <p>Sign in with the Google account that owns your business listing.</p></div>
                    <button class="btn" onclick="connect()"><i class="fab fa-google"></i> Connect Google</button>
                </div>`;
            return;
        }
        const loc = status.location;
        document.getElementById('bar').innerHTML = `
            <div class="gb-bar">
                <span class="gb-dot on"></span>
                <div class="gb-where">
                    <b>${esc(loc ? loc.title : 'Connected')}</b>
                    <p>${loc ? 'Connected to Google' : 'Choose which business listing to manage'}</p>
                </div>
                ${loc ? '<button class="btn btn-ghost btn-sm" onclick="loadLocations()">Change listing</button>' : ''}
                <button class="btn btn-ghost btn-sm" onclick="disconnect()">Disconnect</button>
            </div>
            <div id="picker"></div>`;
    }

    async function connect() {
        try {
            // origin=web matters: without it the callback hands off to the
            // tapifapp:// deep link, which does nothing in a desktop browser.
            const d = await api('connect-url.php?origin=web');
            location.href = d.auth_url;
        } catch (e) { alert(e.message); }
    }

    async function disconnect() {
        if (!confirm('Disconnect Google Business Profile? Reviews and posts will stop syncing.')) return;
        try { await api('disconnect.php', { method: 'POST', body: '{}' }); boot(); }
        catch (e) { alert(e.message); }
    }

    async function loadLocations() {
        const slot = document.getElementById('picker') || document.getElementById('panel');
        slot.innerHTML = '<div class="card"><p class="muted">Loading your listings…</p></div>';
        try {
            const d = await api('locations.php');
            const list = d.locations || [];
            if (!list.length) {
                slot.innerHTML = '<div class="warn">No business listings found on this Google account.</div>';
                return;
            }
            slot.innerHTML = `<div class="card"><h3>Choose the listing to manage</h3>
                ${list.map(l => `
                    <div class="row" style="padding:9px 0;border-bottom:1px solid #f0ece6">
                        <div class="grow">
                            <b style="font-size:.88rem;color:#153e3f">${esc(l.title || l.id)}</b>
                            ${l.address ? `<div class="muted" style="font-size:.76rem">${esc(l.address)}</div>` : ''}
                        </div>
                        <button class="btn btn-sm" onclick="pickLocation('${esc(l.id)}')">Use this</button>
                    </div>`).join('')}
            </div>`;
        } catch (e) { slot.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
    }

    async function pickLocation(id) {
        try {
            await api('select-location.php', { method: 'POST', body: JSON.stringify({ location_id: id }) });
            boot();
        } catch (e) { alert(e.message); }
    }

    /* ───────────────────────────────── tabs ─────────────────────────── */

    function renderTabs() {
        document.getElementById('tabs').innerHTML = TABS.map(([k, l]) =>
            `<button class="gb-tab ${k === tab ? 'on' : ''}" onclick="openTab('${k}')">${esc(l)}</button>`).join('');
    }

    function openTab(k) {
        tab = k;
        renderTabs();
        const p = document.getElementById('panel');
        p.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
        ({ score: tabScore, info: tabInfo, reviews: tabReviews, posts: tabPosts,
           photos: tabPhotos, insights: tabInsights, services: tabServices,
           attributes: tabAttrs, ask: tabAsk, funnel: tabFunnel }[k])(p);
    }

    const fail = (p) => (e) => { p.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; };
    const stars = (n) => '★★★★★'.slice(0, Math.max(0, Math.round(n || 0))).padEnd(5, '☆');

    /* ── marketing score ──────────────────────────────────────────────── */
    /**
     * In the app the score lives on the AI Growth Center screen; here it is a
     * tab on the listing it describes, because on a desktop sidebar the two
     * pages sit one above the other and splitting them only hides it.
     *
     * Every item carries a fix_in telling the customer WHERE the missing point
     * is earned — a score with no route to act on it is just a number.
     */
    const BAND = {
        excellent: ['#15803d', '#dcfce7'],
        good:      ['#0369a1', '#e0f2fe'],
        fair:      ['#b45309', '#fef3c7'],
        poor:      ['#b91c1c', '#fee2e2'],
    };
    // A score item's fix_in → the tab that fixes it. Anything unlisted falls
    // back to the listing editor, so a new item can never dead-end.
    const FIX_TAB = {
        google_business: ['info',       'Edit'],
        google_reviews:  ['reviews',    'Reply'],
        request_review:  ['ask',        'Ask'],
        google_posts:    ['posts',      'Post'],
        services:        ['services',   'Add'],
        attributes:      ['attributes', 'Set'],
        photos:          ['photos',     'Upload'],
    };

    async function tabScore(p, refresh) {
        try {
            const d = await api('marketing-score.php' + (refresh ? '?refresh=1' : ''));
            const band = BAND[d.band] || BAND.fair;
            const pct = Math.max(0, Math.min(100, Math.round(d.score || 0)));
            const items = d.items || [];
            const groups = [];
            items.forEach(it => { if (groups.indexOf(it.group) < 0) groups.push(it.group); });

            p.innerHTML = `
              <div class="card">
                <div class="sc-head">
                  <div class="gauge" style="background:conic-gradient(${band[0]} ${pct * 3.6}deg, #f0ece6 0)">
                    <i><b>${pct}</b><s>of ${esc(d.max || 100)}</s></i>
                  </div>
                  <div class="sc-sum">
                    <span class="sc-band" style="color:${band[0]};background:${band[1]}">${esc(d.band || '')}</span>
                    <div>${esc(d.summary || '')}</div>
                  </div>
                  <button class="btn btn-ghost btn-sm" onclick="tabScore(document.getElementById('panel'), 1)">Recheck</button>
                </div>
              </div>
              ${groups.map(g => `
              <div class="card">
                <div class="sc-grp" style="margin-top:0">${esc(g)}</div>
                ${items.filter(it => it.group === g).map(renderScoreItem).join('')}
              </div>`).join('')
                || '<div class="card"><p class="muted">No score items came back from Google.</p></div>'}`;
        } catch (e) { fail(p)(e); }
    }

    function renderScoreItem(it) {
        const done = Number(it.earned || 0) >= Number(it.points || 0);
        const fix = FIX_TAB[it.fix_in] || ['info', 'Fix'];
        return `<div class="sc-it">
            <span class="sc-tick ${done ? 'on' : 'off'}">${done ? '✓' : '!'}</span>
            <span class="sc-lbl">${esc(it.label || it.key || '')}</span>
            <span class="sc-pts">${esc(it.earned || 0)}/${esc(it.points || 0)}</span>
            ${done ? '' : `<button class="btn btn-ghost btn-sm" onclick="openTab('${esc(fix[0])}')">${esc(fix[1])}</button>`}
        </div>`;
    }

    /* ── business info ────────────────────────────────────────────────── */
    /**
     * The editable listing fields, mirroring the app's Google Business screen:
     * what Google lets us PATCH on top, what it only lets us read underneath.
     * `editable` comes from the server (FieldMap), so the form never offers a
     * box for something the API will reject.
     */
    const FIELD_LABELS = {
        business_name: 'Business name', description: 'Description',
        phone: 'Phone', website: 'Website',
        primary_category: 'Primary category', address: 'Address', hours: 'Hours',
    };
    const READONLY = ['primary_category', 'address', 'hours'];

    async function tabInfo(p) {
        try {
            const d = await api('location.php');
            const f = d.fields || {};
            const editable = d.editable && d.editable.length
                ? d.editable : ['business_name', 'description', 'phone', 'website'];
            p.innerHTML = `
              <div class="card">
                <h3>Your Google listing</h3>
                ${editable.map(k => `
                  <label class="lbl">${esc(FIELD_LABELS[k] || k)}</label>
                  ${k === 'description'
                    ? `<textarea class="ta" id="f_${esc(k)}">${esc(f[k] || '')}</textarea>`
                    : `<input class="inp" id="f_${esc(k)}" value="${esc(f[k] || '')}">`}`).join('')}
                <div class="row" style="margin-top:14px">
                  <button class="btn" id="infoSave" onclick="saveInfo()">Save to Google</button>
                  <span class="muted" id="infoMsg"></span>
                </div>
                <p class="muted" style="margin-top:10px">Google reviews some edits before they go live,
                   so a change can take a little while to appear publicly.</p>
              </div>
              <div class="card">
                <h3>From your Google listing</h3>
                ${READONLY.map(k => `<div class="fld"><span>${esc(FIELD_LABELS[k] || k)}</span>
                    <div>${esc(f[k] || '—')}</div></div>`).join('')}
              </div>`;
            infoEditable = editable;
        } catch (e) { fail(p)(e); }
    }
    let infoEditable = [];

    async function saveInfo() {
        const btn = document.getElementById('infoSave');
        const msg = document.getElementById('infoMsg');
        const body = {};
        infoEditable.forEach(k => {
            const el = document.getElementById('f_' + k);
            if (el) body[k] = el.value;
        });
        btn.disabled = true; msg.textContent = 'Saving…';
        try {
            await api('update.php', { method: 'POST', body: JSON.stringify(body) });
            msg.textContent = 'Saved to Google.';
        } catch (e) { msg.textContent = ''; alert(e.message); }
        btn.disabled = false;
    }

    /**
     * Writes a reply with AI and drops it in the box, the way the app's Suggest
     * button does. It is NOT posted — the customer reads and edits it first,
     * because this goes out publicly under their business name.
     *
     * Press it again for a different tone. Warm first for praise, measured
     * first for a complaint: a breezy "Thanks so much!" under a one-star review
     * reads as not having read it. Once all four tones are used, the next press
     * regenerates instead of returning the cached set again.
     */
    const suggestState = {};
    async function suggest(id) {
        const btn = document.getElementById('sg_' + id);
        const box = document.getElementById('rp_' + id);
        const r = (lastReviews || []).find(x => String(x.id || x.review_id) === String(id));
        if (!r || !btn || !box) return;

        const stars = Number(r.stars || r.rating || 0);
        const order = stars >= 4
            ? ['friendly', 'professional', 'short', 'formal']
            : ['professional', 'formal', 'short', 'friendly'];
        const seen = suggestState[id] || { tone: 0 };
        const exhausted = seen.tone >= order.length;

        const old = btn.innerHTML;
        btn.disabled = true; btn.textContent = 'Writing…';
        try {
            const res = await fetch(API + '/api/ai/review-reply.php', {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    review: r.comment || '',
                    business_name: (lastLocationTitle || ''),
                    // reviewer, stars and review_id are not optional extras: without
                    // them every short review generated the same sentence, and two
                    // reviews with identical text were served the identical cached
                    // reply — in public, under the customer's own name.
                    reviewer: r.reviewer || r.author || '',
                    stars: stars,
                    review_id: id,
                    regenerate: exhausted,
                }),
            });
            const j = await res.json().catch(() => ({}));
            if (!j.success) throw new Error(j.message || 'Could not write a reply.');

            const out = (j.data && j.data.result) || {};
            const idx = exhausted ? 0 : seen.tone;
            const pick = order.slice(idx).map(k => out[k]).find(v => v && String(v).trim())
                      || order.map(k => out[k]).find(v => v && String(v).trim());
            suggestState[id] = { tone: exhausted ? 1 : seen.tone + 1 };

            if (pick) { box.value = String(pick).trim(); box.focus(); }
            else alert('The AI did not return a reply. Try again.');
        } catch (e) { alert(e.message); }
        btn.disabled = false; btn.innerHTML = old;
    }

    function copyLink() {
        const el = document.getElementById('revLink');
        el.select();
        navigator.clipboard ? navigator.clipboard.writeText(el.value) : document.execCommand('copy');
    }
    const DEFAULT_ASK_MSG = 'thanks for choosing us! Could you leave us a quick Google review?';

    /**
     * The mirror of the app's normalisePhone (src/utils/phone.js), which is
     * itself the mirror of GoogleBusinessService::normalisePhone. All three
     * have to agree or the "already asked" check quietly stops matching:
     * the same customer saved as 9876543210 here and 919876543210 there is
     * two different people as far as the log is concerned.
     */
    function normalisePhone(raw) {
        let d = String(raw || '').replace(/\D+/g, '');
        if (!d) return '';
        if (d.length > 12 && d.indexOf('00') === 0) d = d.slice(2);
        if (d.length === 11 && d[0] === '0') d = d.slice(1);
        if (d.length === 10) d = '91' + d;
        return (d.length >= 11 && d.length <= 15) ? d : '';
    }

    function askText(name) {
        const box = document.getElementById('askMsg');
        const body = ((box && box.value) || DEFAULT_ASK_MSG).trim();

        return (name ? 'Hi ' + name + ', ' : '') + body + (link ? ' ' + link : '');
    }

    /** Open the owner's own WhatsApp with the message ready, and log the ask. */
    async function openAsk(name, phone) {
        // Logged first, then handed off: if the popup is blocked we still know
        // it was attempted, and a failed log must never stop them asking.
        try {
            await api('review-requests.php', {
                method: 'POST',
                body: JSON.stringify({ name: name, phone: phone, channel: 'whatsapp' }),
            });
        } catch (e) { /* logging the ask must not stop them asking */ }
        window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(askText(name)),
            '_blank', 'noopener');
    }

    async function askSend() {
        const phone = normalisePhone(document.getElementById('askPhone').value);
        const name = (document.getElementById('askName').value || '').trim();
        if (!phone) { alert('Enter a valid mobile number, with the country code if it is not Indian.'); return; }
        await openAsk(name, phone);
        openTab('ask');
    }

    /* ── asking several ───────────────────────────────────────────────────
       The same shape as the app's Request a Review screen: a queue you build,
       then send one at a time from your OWN WhatsApp. Nothing is sent from
       Tapify's servers — that is what keeps this clear of bulk-messaging rules
       and of Google's prohibition on soliciting reviews at scale, and it is
       why there is no "send all" button. */
    let askQueue = [];

    function bulkAdd() {
        const box = document.getElementById('bulkPaste');
        const seen = {};
        askQueue.forEach(q => { seen[q.phone] = true; });
        let added = 0, dupes = 0, bad = 0;

        (box.value || '').split(/[\n,;]+/).forEach(line => {
            const raw = line.trim();
            if (!raw) return;
            const phone = normalisePhone(raw);
            if (!phone) { bad++; return; }
            if (seen[phone]) { dupes++; return; }
            seen[phone] = true;
            // Whatever is left once the digits are stripped out is the name:
            // people paste "Ramesh 98765 43210" as readily as a bare number.
            const name = raw.replace(/[0-9+()\-\s]+$/, '').replace(/^[^A-Za-z]+/, '').trim();
            askQueue.push({ name: name, phone: phone });
            added++;
        });

        box.value = '';
        const bits = [];
        if (added) bits.push(added + ' added');
        if (dupes) bits.push(dupes + ' already queued');
        if (bad) bits.push(bad + ' not a valid number');
        document.getElementById('bulkMsg').textContent = bits.length ? bits.join(' · ') : 'Nothing to add.';
        renderQueue();
    }

    function renderQueue() {
        const box = document.getElementById('queueBox');
        if (!box) return;
        if (!askQueue.length) { box.innerHTML = ''; return; }
        const asked = askedBefore;
        box.innerHTML = `
          <div class="row" style="justify-content:space-between;margin-bottom:8px">
            <b style="font-size:.86rem;color:#153e3f">Queue (${askQueue.length})</b>
            <button class="btn btn-ghost btn-sm" onclick="askQueue=[];renderQueue()">Clear all</button>
          </div>
          ${askQueue.map((q, i) => `
            <div class="row" style="padding:8px 0;border-bottom:1px solid #f0ece6">
              <span class="grow" style="font-size:.86rem">
                ${esc(q.name || '—')} <span class="muted">+${esc(q.phone)}</span>
                ${asked[q.phone] ? '<span class="muted" style="color:#b45309"> · asked before</span>' : ''}
              </span>
              <button class="btn btn-sm" onclick="queueSend(${i})">Open WhatsApp</button>
              <button class="btn btn-ghost btn-sm" onclick="queueDrop(${i})">Remove</button>
            </div>`).join('')}
          <p class="muted" style="margin-top:10px">Each one opens a WhatsApp tab with the message ready.
            Send it, come back, and do the next — a human between each is what keeps this personal
            outreach rather than a blast.</p>`;
    }

    function queueDrop(i) { askQueue.splice(i, 1); renderQueue(); }

    async function queueSend(i) {
        const q = askQueue[i];
        if (!q) return;
        await openAsk(q.name, q.phone);
        askQueue.splice(i, 1);
        askedBefore[q.phone] = true;
        renderQueue();
    }

    /** Numbers already in the log, so the queue can flag a repeat ask. */
    let askedBefore = {};

    /* ── review funnel ────────────────────────────────────────────────────
       The smart link: 4-5 stars go on to Google, 1-3 stars land in a private
       form that only you see. Those private ones are the whole point — a
       complaint you can answer before it becomes a public one-star — so they
       lead here rather than sitting under a separate sidebar page.

       Different API family from the rest of this screen (/api/reviews/, not
       /api/google/gbp/), so it does not use the api() helper above. */
    const REV_API = API + '/api/reviews/';

    async function revApi(path, opts) {
        const r = await fetch(REV_API + path, Object.assign({
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
        }, opts || {}));
        const j = await r.json().catch(() => ({}));
        if (!j.success) throw new Error(j.message || ('Request failed (' + r.status + ')'));
        return j;
    }

    const FUNNEL_BASE = 'https://review-google.vercel.app';

    async function tabFunnel(p) {
        p.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
        // Settled independently: a funnel that has never been set up 404s, and
        // that must not blank the private reviews alongside it.
        const [cfg, stats, list] = await Promise.allSettled([
            revApi('manage_funnel.php'),
            revApi('get_analytics.php'),
            revApi('get_reviews.php'),
        ]);
        const ok = (r) => (r.status === 'fulfilled' ? r.value : null);
        const fd = ok(cfg) && ok(cfg).data;
        const an = (ok(stats) && ok(stats).data) || {};
        const rows = (ok(list) && ok(list).data) || [];
        const slug = fd && fd.slug ? fd.slug : '';

        p.innerHTML = `
          <div class="card">
            <h3>Your smart review link</h3>
            <p class="muted" style="margin-bottom:10px">Happy customers go straight to Google.
              Anyone giving 1&ndash;3 stars is shown a private form instead, and lands in the table below
              rather than on your public listing.</p>
            <label class="lbl">Your Google review URL</label>
            <div class="row">
              <input class="inp grow" id="fnUrl" placeholder="https://g.page/r/..."
                     value="${esc((fd && fd.google_review_url) || '')}">
              <button class="btn btn-sm" onclick="funnelSave()">Save</button>
            </div>
            <p class="muted" id="fnMsg" style="margin-top:8px"></p>
            ${slug ? `
            <div class="row" style="margin-top:14px;align-items:flex-start;gap:18px">
              <div id="fnQr"></div>
              <div class="grow">
                <label class="lbl" style="margin-top:0">Share this link</label>
                <div class="row">
                  <input class="inp grow" id="fnLink" readonly value="${esc(FUNNEL_BASE + '/' + slug)}">
                  <button class="btn btn-sm" onclick="funnelCopy()">Copy</button>
                </div>
                <p class="muted" style="margin-top:8px">Print the QR for the counter, or send the link
                  after a job. Use this instead of the raw Google link above.</p>
              </div>
            </div>` : ''}
          </div>

          <div class="card">
            <div class="stat-row">
              <div class="stat"><b>${esc(an.scans || 0)}</b><span>Scans</span></div>
              <div class="stat"><b>${esc(an.redirects || 0)}</b><span>Sent to Google</span></div>
              <div class="stat"><b>${esc(rows.length)}</b><span>Private feedback</span></div>
            </div>
          </div>

          <div class="card">
            <h3>Private feedback (1&ndash;3 stars)</h3>
            <p class="muted" style="margin-bottom:10px">These never reached Google. Call them back &mdash;
              a complaint answered privately is the one that does not become a public review.</p>
            ${rows.length ? rows.map(r => `
              <div class="rev">
                <div class="rev-top">
                  <span class="rev-who">${esc(r.customer_name || 'Anonymous')}</span>
                  <span class="rev-when">${esc(r.created_at || '')}</span>
                </div>
                <div class="rev-stars">${stars(r.rating)}</div>
                <p class="rev-txt">${r.feedback_text ? esc(r.feedback_text) : '<span class="muted">No text left.</span>'}</p>
                <div class="row" style="margin-top:9px">
                  ${r.customer_phone ? `<a class="btn btn-sm" href="tel:${esc(r.customer_phone)}">Call ${esc(r.customer_phone)}</a>
                     <a class="btn btn-ghost btn-sm" target="_blank" rel="noopener"
                        href="https://wa.me/${esc(normalisePhone(r.customer_phone))}">WhatsApp</a>` : ''}
                  ${r.media_url ? `<a class="btn btn-ghost btn-sm" href="${esc(r.media_url)}" target="_blank" rel="noopener">View photo</a>` : ''}
                </div>
              </div>`).join('') : '<p class="muted">No private feedback yet.</p>'}
          </div>`;

        if (slug) drawFunnelQr(FUNNEL_BASE + '/' + slug);
    }

    async function funnelSave() {
        const url = (document.getElementById('fnUrl').value || '').trim();
        const msg = document.getElementById('fnMsg');
        if (!url) { msg.textContent = 'Paste your Google review URL first.'; return; }
        msg.textContent = 'Saving…';
        try {
            await revApi('manage_funnel.php', { method: 'POST', body: JSON.stringify({ google_review_url: url }) });
            openTab('funnel');
        } catch (e) { msg.textContent = e.message; }
    }

    function funnelCopy() {
        const el = document.getElementById('fnLink');
        navigator.clipboard.writeText(el.value)
            .then(() => { document.getElementById('fnMsg').textContent = 'Link copied.'; })
            .catch(() => { el.select(); document.execCommand('copy'); });
    }

    /**
     * The QR library is fetched only when this tab is opened — it is a third
     * script on a page that already loads two, and nobody on the Score or
     * Reviews tab ever needs it.
     */
    function drawFunnelQr(link) {
        const draw = () => {
            const box = document.getElementById('fnQr');
            if (!box || !window.QRCode) return;
            box.innerHTML = '';
            new QRCode(box, { text: link, width: 150, height: 150 });
        };
        if (window.QRCode) return draw();
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
        s.onload = draw;
        document.head.appendChild(s);
    }

    document.addEventListener('DOMContentLoaded', boot);
    </script>
</body>
</html>
