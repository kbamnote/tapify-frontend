<script>
const APPT_API = 'https://app.tapify.co.in/api/sites/appointments.php';
let ALL = [];
let statusFilter = '';

document.addEventListener('DOMContentLoaded', () => {
    loadAppointments();
    document.getElementById('search').addEventListener('input', render);
    document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            statusFilter = btn.dataset.status;
            render();
        });
    });
});

async function loadAppointments() {
    try {
        const res = await fetch(APPT_API, { credentials: 'include' });
        if (res.status === 401) { window.location.href = '../login.html'; return; }
        const json = await res.json();
        if (!json.success) throw new Error(json.message || 'Failed');
        ALL = (json.data && json.data.appointments) || [];
        const s = (json.data && json.data.stats) || {};
        document.getElementById('cAll').textContent = s.total || 0;
        document.getElementById('cToday').textContent = s.today || 0;
        document.getElementById('cUpcoming').textContent = s.upcoming || 0;
        document.getElementById('cPending').textContent = s.pending || 0;
        render();
    } catch (e) {
        document.getElementById('apptList').innerHTML =
            '<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>Could not load appointments. Please refresh.</div>';
    }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    let rows = ALL;
    if (statusFilter) rows = rows.filter(a => a.status === statusFilter);
    if (q) rows = rows.filter(a =>
        (a.customer_name || '').toLowerCase().includes(q) ||
        (a.customer_phone || '').toLowerCase().includes(q) ||
        (a.service_name || '').toLowerCase().includes(q));

    const wrap = document.getElementById('apptList');
    if (!rows.length) {
        wrap.innerHTML = '<div class="empty-state"><i class="fas fa-calendar-day"></i>No appointments yet.<br><small>Bookings made on your published websites will appear here.</small></div>';
        return;
    }

    wrap.innerHTML = rows.map(a => {
        const phone = (a.customer_phone || '').replace(/\D/g, '');
        const when = a.created_at ? new Date(a.created_at.replace(' ', 'T')).toLocaleString() : '';
        return `
        <div class="order-card ${esc(a.status)}">
            <div class="order-top">
                <div>
                    <span class="order-site"><i class="fas fa-globe"></i> ${esc(a.site_name || a.site_slug)}</span>
                    <p class="order-item" style="margin-top:6px">${esc(a.customer_name)}</p>
                    <span class="appt-when">${esc(a.date_formatted || a.appointment_date)} · ${esc(a.time_formatted || a.appointment_time)}</span>
                    ${a.day_name ? `<div class="appt-day">${esc(a.day_name)}</div>` : ''}
                    ${a.service_name ? `<div><span class="order-opt">Service: ${esc(a.service_name)}</span></div>` : ''}
                </div>
                <div class="order-time">Booked ${esc(when)}</div>
            </div>
            <div class="order-meta">
                <span><i class="fas fa-phone"></i> <a href="tel:${esc(a.customer_phone)}">${esc(a.customer_phone)}</a></span>
                ${a.customer_email ? `<span><i class="fas fa-envelope"></i> <a href="mailto:${esc(a.customer_email)}">${esc(a.customer_email)}</a></span>` : ''}
            </div>
            ${a.customer_notes ? `<div class="appt-notes"><i class="fas fa-comment-dots"></i> ${esc(a.customer_notes)}</div>` : ''}
            <div class="order-foot">
                <div class="order-actions">
                    ${phone ? `<a class="btn-action btn-whatsapp" target="_blank" rel="noopener" href="https://wa.me/${phone}"><i class="fab fa-whatsapp"></i> WhatsApp</a>` : ''}
                    ${phone ? `<a class="btn-action btn-call" href="tel:${esc(a.customer_phone)}"><i class="fas fa-phone"></i> Call</a>` : ''}
                </div>
                <select class="status-select" onchange="setStatus(${a.id}, this.value)">
                    ${['pending','confirmed','completed','cancelled','no_show'].map(s =>
                        `<option value="${s}" ${a.status === s ? 'selected' : ''}>${s === 'no_show' ? 'No show' : s.charAt(0).toUpperCase() + s.slice(1)}</option>`).join('')}
                </select>
            </div>
        </div>`;
    }).join('');
}

async function setStatus(id, status) {
    try {
        const res = await fetch(APPT_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ id, status })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        loadAppointments();
    } catch (e) {
        alert('Could not update the appointment status.');
    }
}

/* ===================== Weekly availability manager =====================
   The owner sets which hours are bookable on each day. The published site
   reads this (api/sites/slots_public.php) and offers only those times, minus
   whatever is already booked — so visitors can no longer request 3am, and two
   people cannot take the same slot.

   A day with no ranges = closed for bookings. Several ranges on one day is how
   a lunch break is expressed: 10:00-13:00 and 16:00-19:00 leaves 13:00-16:00
   unbookable.                                                              */
const SLOTS_API = 'https://app.tapify.co.in/api/sites/slots_manage.php';
const DAY_NAMES = { 1:'MONDAY', 2:'TUESDAY', 3:'WEDNESDAY', 4:'THURSDAY', 5:'FRIDAY', 6:'SATURDAY', 0:'SUNDAY' };
const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
let avWeek = { 0:[], 1:[], 2:[], 3:[], 4:[], 5:[], 6:[] };
let avSettings = { slot_minutes: 30, lead_minutes: 120, horizon_days: 60, capacity: 1 };

function showAvailabilityModal() {
    document.body.insertAdjacentHTML('beforeend', `
        <div class="av-overlay" id="avModal" onclick="if(event.target===this)closeAvailabilityModal()">
          <div class="av-box">
            <div class="av-head">
              <h3><i class="fas fa-clock" style="color:#8338ec"></i> Manage Availability</h3>
              <button class="av-close" onclick="closeAvailabilityModal()">&times;</button>
            </div>
            <div class="av-body">
              <div class="av-note">
                Visitors booking on your website will only be offered these times, and any slot
                that's already booked disappears automatically. Leave a day switched off to stop
                taking bookings that day.
              </div>
              <div style="margin-bottom:16px">
                <label class="av-label">Website</label>
                <select id="avSite" class="av-select" onchange="loadAvailability()"></select>
              </div>
              <div id="avContent">
                <div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Loading…</div>
              </div>
            </div>
            <div class="av-foot">
              <button class="btn-modal-cancel" onclick="closeAvailabilityModal()">Cancel</button>
              <button class="btn-modal-confirm" id="avSave" onclick="saveAvailability()">
                <i class="fas fa-save"></i> Save Availability
              </button>
            </div>
          </div>
        </div>`);
    loadAvailability(true);
}

function closeAvailabilityModal() { document.getElementById('avModal')?.remove(); }

async function loadAvailability(firstOpen = false) {
    const content = document.getElementById('avContent');
    const siteSel = document.getElementById('avSite');
    if (!content) return;
    content.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Loading…</div>';

    const siteId = (!firstOpen && siteSel && siteSel.value) ? siteSel.value : '';
    try {
        const res  = await fetch(SLOTS_API + (siteId ? ('?site_id=' + encodeURIComponent(siteId)) : ''), { credentials: 'include' });
        if (res.status === 401) { window.location.href = '../login.html'; return; }
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        const d = json.data || {};

        if (firstOpen && siteSel) {
            const sites = d.sites || [];
            if (!sites.length) {
                content.innerHTML = '<div class="empty-state"><i class="fas fa-globe"></i>You don\'t have a website yet.<br><small>Create one in the Website Builder first.</small></div>';
                document.getElementById('avSave').disabled = true;
                return;
            }
            siteSel.innerHTML = sites.map(s => `<option value="${s.id}">${esc(s.name || s.slug)}</option>`).join('');
            if (d.site_id) siteSel.value = d.site_id;
        }

        avWeek = { 0:[], 1:[], 2:[], 3:[], 4:[], 5:[], 6:[] };
        (d.schedule || []).forEach(r => {
            avWeek[r.day_of_week].push({ start: String(r.start_time).slice(0,5), end: String(r.end_time).slice(0,5) });
        });
        avSettings = Object.assign(avSettings, d.settings || {});

        if (d.migrated === false) {
            content.innerHTML = '<div class="empty-state"><i class="fas fa-database"></i>Availability isn\'t set up on the server yet.<br><small>Run migration_site_schedule.sql, then reload this page.</small></div>';
            document.getElementById('avSave').disabled = true;
            return;
        }
        document.getElementById('avSave').disabled = false;
        renderAvailability();
    } catch (e) {
        content.innerHTML = '<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>Could not load availability.</div>';
    }
}

/* A dropdown of times in AM/PM, every 15 minutes.
   <input type="time"> shows 24-hour or AM/PM entirely according to the browser
   and OS locale — it cannot be forced from markup — so on most Indian and
   European setups it rendered "18:00". This guarantees AM/PM everywhere.
   The VALUE stays 24-hour HH:MM, which is what the API and MySQL TIME expect. */
function timeOptions(selected) {
    let out = '';
    let matched = false;
    for (let h = 0; h < 24; h++) {
        for (const m of [0, 15, 30, 45]) {
            const v = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
            const ap = h < 12 ? 'AM' : 'PM';
            const hh = (h % 12) || 12;
            const label = String(hh).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ' ' + ap;
            if (v === selected) matched = true;
            out += `<option value="${v}"${v === selected ? ' selected' : ''}>${label}</option>`;
        }
    }
    // A previously saved time that is not on a 15-minute boundary (e.g. 09:20)
    // would otherwise fall off the list and silently snap to 12:00 AM on the
    // next save, quietly changing the owner's hours. Keep it as its own option.
    if (selected && !matched) {
        const [hs, ms] = selected.split(':');
        const h = parseInt(hs, 10);
        const label = String((h % 12) || 12).padStart(2, '0') + ':' + ms + ' ' + (h < 12 ? 'AM' : 'PM');
        out = `<option value="${selected}" selected>${label}</option>` + out;
    }
    return out;
}

function renderAvailability() {
    const rows = DAY_ORDER.map(day => {
        const ranges = avWeek[day] || [];
        const on = ranges.length > 0;
        const body = on
            ? ranges.map((r, i) => `
                <div class="av-range">
                  <select class="av-input av-time" onchange="avUpdate(${day},${i},'start',this.value)">${timeOptions(r.start)}</select>
                  <span style="color:#6b7280;font-size:.85rem">to</span>
                  <select class="av-input av-time" onchange="avUpdate(${day},${i},'end',this.value)">${timeOptions(r.end)}</select>
                  <button class="av-icon-btn" style="color:#ef4444" title="Remove" onclick="avRemove(${day},${i})"><i class="fas fa-trash"></i></button>
                </div>`).join('')
            : '<div class="av-unavail">Not taking bookings</div>';
        return `
          <div class="av-day">
            <div class="av-day-name">
              <input type="checkbox" ${on ? 'checked' : ''} onchange="avToggle(${day},this.checked)"
                     style="width:18px;height:18px;accent-color:#8338ec;cursor:pointer">
              <strong>${DAY_NAMES[day]}</strong>
            </div>
            <div class="av-ranges">${body}</div>
            <div class="av-day-actions">
              <button class="av-icon-btn" style="color:#8338ec" title="Add another range" onclick="avAdd(${day})"><i class="fas fa-plus"></i></button>
              <button class="av-icon-btn" style="color:#6b7280" title="Apply these timings to every day" onclick="avCopyToAll(${day})"${on ? '' : ' disabled'}><i class="fas fa-copy"></i></button>
            </div>
          </div>`;
    }).join('');

    document.getElementById('avContent').innerHTML = `
      <div class="av-rules">
        <div>
          <label class="av-label">Slot length</label>
          <select class="av-select" onchange="avSettings.slot_minutes=parseInt(this.value,10)">
            ${[15,20,30,45,60,90,120].map(v => `<option value="${v}" ${avSettings.slot_minutes==v?'selected':''}>${v} minutes</option>`).join('')}
          </select>
          <p class="av-hint">How long each booking takes.</p>
        </div>
        <div>
          <label class="av-label">Minimum notice</label>
          <select class="av-select" onchange="avSettings.lead_minutes=parseInt(this.value,10)">
            ${[0,30,60,120,240,720,1440].map(v => `<option value="${v}" ${avSettings.lead_minutes==v?'selected':''}>${v===0?'None':(v<60?v+' minutes':(v/60)+' hour'+(v>60?'s':''))}</option>`).join('')}
          </select>
          <p class="av-hint">Stops last-minute bookings.</p>
        </div>
        <div>
          <label class="av-label">Book up to</label>
          <select class="av-select" onchange="avSettings.horizon_days=parseInt(this.value,10)">
            ${[7,14,30,60,90,180,365].map(v => `<option value="${v}" ${avSettings.horizon_days==v?'selected':''}>${v} days ahead</option>`).join('')}
          </select>
          <p class="av-hint">How far in advance people can book.</p>
        </div>
        <div>
          <label class="av-label">Bookings per slot</label>
          <select class="av-select" onchange="avSettings.capacity=parseInt(this.value,10)">
            ${[1,2,3,4,5,6,8,10,12,15,20,30,50].map(v => `<option value="${v}" ${avSettings.capacity==v?'selected':''}>${v} ${v===1?'booking':'bookings'}</option>`).join('')}
          </select>
          <p class="av-hint">How many people you can take at the same time — chairs, doctors, tables. Once a slot is full it disappears from the website.</p>
        </div>
      </div>
      ${rows}
      <p class="av-hint" style="margin-top:12px">
        Add two ranges to a day to leave a break — 10:00 AM–01:00 PM and 04:00 PM–07:00 PM keeps the afternoon free.
        Use the <i class="fas fa-copy"></i> button to apply a day's timings to the whole week.
      </p>`;
}

function avToggle(day, on) {
    avWeek[day] = on ? (avWeek[day].length ? avWeek[day] : [{ start: '09:00', end: '17:00' }]) : [];
    renderAvailability();
}
function avAdd(day)    { avWeek[day].push({ start: '09:00', end: '17:00' }); renderAvailability(); }
function avRemove(day, i) { avWeek[day].splice(i, 1); renderAvailability(); }
function avUpdate(day, i, field, val) { avWeek[day][i][field] = val; }

/** Apply one day's timings to every other day. */
function avCopyToAll(day) {
    const src = avWeek[day] || [];
    if (!src.length) { alert('Add a time range to this day first, then copy it.'); return; }
    const summary = src.map(r => fmtAmPm(r.start) + '–' + fmtAmPm(r.end)).join(', ');
    if (!confirm(`Apply ${summary} to every day?\n\nThis replaces the timings currently set on all other days.`)) return;

    DAY_ORDER.forEach(d => {
        if (d === day) return;
        // Clone each range. Assigning the array itself would make all seven days
        // share the same objects, so editing Monday would silently edit them all.
        avWeek[d] = src.map(r => ({ start: r.start, end: r.end }));
    });
    renderAvailability();
}

/** "18:00" -> "06:00 PM", for confirmation text. */
function fmtAmPm(v) {
    const [hs, ms] = String(v || '').split(':');
    const h = parseInt(hs, 10);
    if (isNaN(h)) return v;
    return String((h % 12) || 12).padStart(2, '0') + ':' + (ms || '00') + ' ' + (h < 12 ? 'AM' : 'PM');
}

async function saveAvailability() {
    const siteId = document.getElementById('avSite')?.value;
    if (!siteId) return;

    const schedule = [];
    let bad = null;
    Object.keys(avWeek).forEach(day => {
        avWeek[day].forEach(r => {
            if (!r.start || !r.end) return;
            // Caught here as well as server-side so the owner gets a pointed
            // message instead of a generic failure.
            if (r.end <= r.start) bad = `${DAY_NAMES[day]}: ${r.start}–${r.end} ends before it starts.`;
            schedule.push({ day: parseInt(day, 10), start: r.start, end: r.end });
        });
    });
    if (bad) { alert(bad); return; }

    const btn = document.getElementById('avSave');
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
    try {
        const res = await fetch(SLOTS_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ action: 'save_week', site_id: siteId, schedule, settings: avSettings })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        closeAvailabilityModal();
    } catch (e) {
        alert(e.message || 'Could not save availability.');
        btn.disabled = false;
        btn.innerHTML = original;
    }
}
</script>
</body>
