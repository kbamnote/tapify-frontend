<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media - Tapify</title>
    <link rel="icon" type="image/png" href="../images/tapify-logo-green.png">
    <link rel="preconnect" href="https://app.tapify.co.in" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../admin-style.css">
    <style>
        .so { max-width: 1100px; margin: 20px auto; padding: 0 20px 48px; }
        .card { background: #fff; border: 1px solid #e9e3dc; border-radius: 15px; padding: 18px; margin-bottom: 14px; }
        .card h3 { margin: 0 0 4px; font-size: .95rem; font-weight: 800; color: #153e3f; }
        .card .hint { margin: 0 0 12px; font-size: .8rem; color: #6b7280; }

        .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
        .tab { border: 1px solid #e9e3dc; background: #fff; color: #6b7280; cursor: pointer;
               padding: 8px 15px; border-radius: 20px; font: inherit; font-size: .82rem; font-weight: 700; }
        .tab.on { background: #153e3f; border-color: #153e3f; color: #fff; }

        /* A grid, not a wrapping flex row: with ten accounts of the same
           platform the names are what you read, and ragged card widths made
           them impossible to scan down. */
        .accts { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
        .acct {
            display: flex; align-items: center; gap: 10px; border: 1.5px solid #e9e3dc;
            border-radius: 12px; padding: 10px 12px; cursor: pointer; background: #fff;
            min-width: 0;
        }
        .acct.on { border-color: #153e3f; background: #f3f8f7; }
        .acct-pic { width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
                    flex: 0 0 auto; background: #f0ece6; }
        .acct-ico { width: 34px; flex: 0 0 auto; text-align: center; font-size: 1.25rem; }
        .acct-txt { flex: 1; min-width: 0; }
        .acct b { font-size: .85rem; color: #153e3f; display: block;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .acct span { font-size: .72rem; color: #6b7280; display: flex; align-items: center; gap: 5px; }
        .acct span i { font-size: .78rem; }
        .fb { color: #1877F2 } .ig { color: #E1306C } .li { color: #0A66C2 }

        .lbl { display: block; font-size: .72rem; font-weight: 700; color: #6b7280;
               text-transform: uppercase; letter-spacing: .5px; margin: 14px 0 5px; }
        .ta { width: 100%; border: 1px solid #e9e3dc; border-radius: 10px; padding: 11px 13px;
              font: inherit; font-size: .9rem; min-height: 110px; resize: vertical; }
        .inp { border: 1px solid #e9e3dc; border-radius: 10px; padding: 9px 12px; font: inherit; font-size: .86rem; }

        .btn { background: #153e3f; color: #fff; border: 0; border-radius: 10px; padding: 11px 20px;
               font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer; }
        .btn:disabled { opacity: .55; cursor: default; }
        .btn-ghost { background: none; color: #153e3f; border: 1px solid #153e3f; }
        .btn-sm { padding: 6px 12px; font-size: .76rem; }

        .media { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .thumb { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden;
                 border: 1px solid #e9e3dc; background: #faf7f4; }
        .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb button { position: absolute; top: 3px; right: 3px; border: 0; border-radius: 50%;
                        width: 20px; height: 20px; background: rgba(0,0,0,.6); color: #fff; cursor: pointer;
                        font-size: .7rem; line-height: 1; }

        .post { border-bottom: 1px solid #f0ece6; padding: 13px 0; }
        .post:last-child { border-bottom: 0; }
        .post-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
        .post-cap { font-size: .87rem; color: #22333b; line-height: 1.5; margin: 5px 0 0; }
        .badge { font-size: .68rem; font-weight: 800; border-radius: 20px; padding: 3px 9px; }
        .b-ok { background: #e8f6ed; color: #15803d } .b-wait { background: #fdf6e7; color: #92670a }
        .b-bad { background: #fdecec; color: #b91c1c }

        .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 12px; }
        .stat { background: #faf7f4; border-radius: 12px; padding: 14px; text-align: center; }
        .stat b { display: block; font-size: 1.5rem; color: #153e3f; }
        .stat span { font-size: .72rem; color: #6b7280; font-weight: 600; }

        .muted { color: #9ca3af; font-size: .85rem; }
        .err { background: #fdecec; border: 1px solid #e9a0a0; border-radius: 11px; padding: 12px 14px;
               font-size: .83rem; color: #8a2a2a; }
        .ok  { background: #f1faf4; border: 1px solid #9ccfae; border-radius: 11px; padding: 12px 14px;
               font-size: .83rem; color: #1a6b3a; }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header">
            <a href="dashboard" class="sidebar-logo">
                <img src="../images/tapify-logo-green.png" alt="Tapify">
            </a>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard" class="nav-item"><i class="fas fa-chart-pie nav-icon"></i><span>Dashboard</span></a>
            <a href="profile" class="nav-item"><i class="fas fa-user nav-icon"></i><span>My Profile</span></a>
            <a href="lead-extractor" class="nav-item"><i class="fas fa-magnifying-glass-location nav-icon" style="color:#0f766e"></i><span>Lead Extractor</span></a>
            <a href="social" class="nav-item active"><i class="fas fa-bullhorn nav-icon" style="color:#e1306c"></i><span>Social Media</span></a>
            <a href="link-pages" class="nav-item"><i class="fas fa-link nav-icon" style="color:#0ea5e9"></i><span>Link Page</span></a>
            <a href="my-designs" class="nav-item"><i class="fas fa-palette nav-icon" style="color:#f59e0b"></i><span>My Designs</span></a>
            <a href="google-business" class="nav-item"><i class="fab fa-google nav-icon" style="color:#4285F4"></i><span>Google Business</span></a>
            <a href="website-builder" class="nav-item"><i class="fas fa-globe nav-icon"></i><span>Website Builder</span></a>
            <a href="whatsapp" class="nav-item"><i class="fab fa-whatsapp nav-icon" style="color:#25D366"></i><span>WhatsApp</span></a>
            <a href="inbox" class="nav-item"><i class="fas fa-inbox nav-icon" style="color:#7c3aed"></i><span>Inbox</span></a>
            <a href="site-orders" class="nav-item"><i class="fas fa-receipt nav-icon"></i><span>Orders</span></a>
            <a href="site-inquiries" class="nav-item"><i class="fas fa-envelope-open-text nav-icon"></i><span>Inquiries</span></a>
            <a href="site-feedback" class="nav-item" data-feature="feedback" style="display:none"><i class="fas fa-star nav-icon"></i><span>Feedback</span></a>
            <a href="site-appointments" class="nav-item"><i class="fas fa-calendar-day nav-icon"></i><span>Appointments</span></a>
            <a href="manage-subscription?tab=gateway" class="nav-item"><i class="fas fa-credit-card nav-icon" style="color:#16a34a"></i><span>Payment Gateway</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="manage-subscription" class="subscription-btn"><i class="fas fa-gem"></i><span>Manage Subscription</span></a>
            <a href="#" onclick="logout()" class="nav-item text-danger"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
        </div>
    </aside>

    <div class="admin-main" id="adminMain">
        <header class="admin-header">
            <div class="header-left">
                <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 class="page-title">Social Media</h1>
            </div>
            <div class="header-right">
                <button class="btn-new-vcard" onclick="boot()"><i class="fas fa-rotate"></i> Refresh</button>
            </div>
        </header>

        <main class="page-content">
            <div class="so">
                <div id="flash"></div>
                <div class="tabs" id="tabs"></div>
                <div id="panel"></div>
            </div>
        </main>
    </div>

    <script src="../admin.js"></script>
    <script>
    const API = 'https://app.tapify.co.in';
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    async function api(path, opts) {
        const r = await fetch(API + '/api/social/' + path, Object.assign({
            credentials: 'include',
        }, opts || {}));
        const j = await r.json().catch(() => ({}));
        if (!j.success) throw new Error(j.message || ('Request failed (' + r.status + ')'));
        return j.data || {};
    }
    const post = (path, body) => api(path, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });

    const TABS = [['compose', 'Compose'], ['inbox', 'Inbox'], ['history', 'History'],
                  ['accounts', 'Accounts'], ['stats', 'Engagement']];
    let tab = 'compose';
    let conns = [];          // connected accounts
    let available = [];      // platforms that can be connected
    let picked = {};         // connection_id -> true
    let media = [];          // [{type,url}]

    const ICON = { facebook: 'fa-brands fa-facebook fb', instagram: 'fa-brands fa-instagram ig',
                   linkedin: 'fa-brands fa-linkedin li' };

    async function boot() {
        const q = new URLSearchParams(location.search);
        if (q.get('status')) {
            document.getElementById('flash').innerHTML = q.get('status') === 'success'
                ? '<div class="ok" style="margin-bottom:14px">Account connected.</div>'
                : '<div class="err" style="margin-bottom:14px">Could not connect ('
                  + esc(q.get('reason') || 'unknown') + '). Please try again.</div>';
            history.replaceState({}, '', location.pathname);
        }
        try {
            const d = await api('connections.php');
            conns = d.connections || [];
            // The endpoint calls this `connectable`; this page read `available`
            // and so always got an empty list — which is why the Accounts tab
            // has never offered a Connect button and instead claimed no
            // platform was configured on the server. Both keys are accepted so
            // a rename on either side cannot silently break it again.
            available = d.connectable || d.available || [];
        } catch (e) {
            document.getElementById('panel').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
            return;
        }
        renderTabs();
        openTab(tab);
    }

    function renderTabs() {
        document.getElementById('tabs').innerHTML = TABS.map(([k, l]) =>
            `<button class="tab ${k === tab ? 'on' : ''}" onclick="openTab('${k}')">${esc(l)}</button>`).join('');
    }
    function openTab(k) {
        tab = k; renderTabs();
        const p = document.getElementById('panel');
        p.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
        ({ compose: tabCompose, inbox: tabInbox, history: tabHistory,
           accounts: tabAccounts, stats: tabStats }[k])(p);
    }

    /**
     * One connected account, as a card.
     *
     * The API field is `account_name` — "Prime Motors", "@tapify.world" — and
     * this page was reading `c.name`, which does not exist in the payload. Every
     * card therefore fell through to the platform string, so ten Facebook pages
     * all rendered as "facebook / facebook" with no way to tell them apart. The
     * app reads account_name and has always shown them correctly.
     *
     * The avatar comes back from the same endpoint and was simply unused; with
     * ten accounts of the same platform the picture is what you actually
     * recognise, so it leads and the platform icon becomes a small badge.
     */
    function acctCard(c, opts) {
        opts = opts || {};
        const name = c.account_name || c.name || ('Unnamed ' + c.platform);
        const face = c.avatar
            ? `<img class="acct-pic" src="${esc(c.avatar)}" alt="" loading="lazy"
                    onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'${esc(ICON[c.platform] || 'fa-solid fa-share-nodes')} acct-ico'}))">`
            : `<i class="${ICON[c.platform] || 'fa-solid fa-share-nodes'} acct-ico"></i>`;
        return `
            <div class="acct ${opts.on ? 'on' : ''}"${opts.onclick ? ` onclick="${opts.onclick}"` : ''}>
              ${face}
              <div class="acct-txt">
                <b title="${esc(name)}">${esc(name)}</b>
                <span><i class="${ICON[c.platform] || 'fa-solid fa-share-nodes'}"></i> ${esc(c.platform)}</span>
              </div>
              ${opts.extra || ''}
            </div>`;
    }

    /* ── inbox ────────────────────────────────────────────────────────────
       What the bot has been saying in the customer's name, and the way to take
       a conversation over. Without this the only place to read a reply is
       Meta's own inbox, which rather defeats the point of the bot being ours. */
    let thread = null;   // { connection_id, contact_id, name }

    const when = (s) => {
        const d = new Date(String(s || '').replace(' ', 'T'));
        return isNaN(d) ? '' : d.toLocaleString(undefined,
            { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    };
    const SRC = { ai: 'AI', handoff: 'Handover', human: 'You', contact: '' };

    async function tabInbox(p) {
        if (thread) return openThread(p);
        try {
            const d = await api('inbox.php');
            const rows = d.threads || [];
            p.innerHTML = `
              <div class="card" style="background:#f5f3ff;border-color:#ddd6fe">
                <h3 style="color:#5b21b6"><i class="fas fa-inbox"></i> WhatsApp, Messenger and Instagram in one place</h3>
                <p class="hint" style="margin:0 0 10px">This tab shows Messenger and Instagram only. The
                  Inbox page shows all three channels in one list.</p>
                <a class="btn btn-sm" href="inbox" style="background:#7c3aed;color:#fff;border-color:#7c3aed">
                  Open the Inbox <i class="fas fa-arrow-right"></i></a>
              </div>
              <div class="card">
                <h3>Messenger &amp; Instagram</h3>
                <p class="hint" style="margin-top:0">Every message to your connected Pages and Instagram
                  accounts, and every reply the chatbot sent. Open one to read it or answer yourself.</p>
                ${rows.length ? rows.map(t => `
                  <div class="acct" style="margin-bottom:8px"
                       onclick="openThreadBy(${Number(t.connection_id)}, '${esc(t.contact_id)}', '${esc(t.contact_name || '')}')">
                    <i class="${ICON[t.platform] || 'fa-solid fa-comment'} acct-ico"></i>
                    <div class="acct-txt">
                      <b>${esc(t.contact_name || ('Visitor ' + String(t.contact_id).slice(-6)))}</b>
                      <span>${esc(t.account_name || t.platform)} &middot; ${esc(when(t.created_at))}</span>
                      <span style="color:#374151">${t.direction === 'out' ? '↩ ' : ''}${esc(String(t.body || '').slice(0, 70))}</span>
                    </div>
                  </div>`).join('')
                : '<p class="muted">No messages yet. They appear here once someone messages a connected Page or Instagram account.</p>'}
              </div>`;
        } catch (e) { p.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
    }

    function openThreadBy(cid, contact, name) {
        thread = { connection_id: cid, contact_id: contact, name: name };
        openTab('inbox');
    }
    function closeThread() { thread = null; openTab('inbox'); }

    async function openThread(p) {
        try {
            const d = await api('inbox.php?connection_id=' + encodeURIComponent(thread.connection_id)
                + '&contact_id=' + encodeURIComponent(thread.contact_id));
            const msgs = d.messages || [];
            p.innerHTML = `
              <div class="card">
                <div class="row" style="justify-content:space-between;margin-bottom:12px">
                  <h3 style="margin:0">${esc(thread.name || ('Visitor ' + String(thread.contact_id).slice(-6)))}</h3>
                  <button class="btn btn-ghost btn-sm" onclick="closeThread()">Back to inbox</button>
                </div>
                <div style="max-height:52vh;overflow:auto;padding-right:4px">
                  ${msgs.map(m => {
                    const out = m.direction === 'out';
                    return `<div style="display:flex;justify-content:${out ? 'flex-end' : 'flex-start'};margin-bottom:9px">
                      <div style="max-width:76%;padding:9px 12px;border-radius:12px;font-size:.86rem;line-height:1.45;
                                  background:${out ? '#eef6f4' : '#f6f4f1'};border:1px solid #e9e3dc">
                        <div>${esc(m.body || '')}</div>
                        <div style="margin-top:4px;font-size:.68rem;color:#9ca3af">
                          ${esc(SRC[m.source] || '')}${m.source && m.source !== 'contact' ? ' &middot; ' : ''}${esc(when(m.created_at))}
                          ${m.error ? ' &middot; <span style="color:#b91c1c">not delivered</span>' : ''}
                        </div>
                      </div>
                    </div>`;
                  }).join('') || '<p class="muted">Nothing in this conversation yet.</p>'}
                </div>
                <div class="row" style="margin-top:14px">
                  <input class="inp grow" id="replyBox" placeholder="Write a reply…"
                         onkeydown="if(event.key==='Enter')sendReply()">
                  <button class="btn" id="replyBtn" onclick="sendReply()">Send</button>
                </div>
                <p class="hint">Meta only allows a reply within 24 hours of their last message.</p>
              </div>`;
        } catch (e) { p.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
    }

    async function sendReply() {
        const box = document.getElementById('replyBox');
        const text = (box.value || '').trim();
        if (!text) return;
        const btn = document.getElementById('replyBtn');
        btn.disabled = true; box.disabled = true;
        try {
            await post('inbox.php', {
                connection_id: thread.connection_id, contact_id: thread.contact_id, message: text,
            });
            openTab('inbox');
        } catch (e) {
            alert(e.message);
            btn.disabled = false; box.disabled = false;
        }
    }

    /* ── accounts ─────────────────────────────────────────────────────── */
    function tabAccounts(p) {
        p.innerHTML = `
          <div class="card">
            <h3>Connected accounts</h3>
            <p class="hint">Posts you write here go out to whichever of these you tick.</p>
            ${conns.length ? `<div class="accts">${conns.map(c => acctCard(c, {
                extra: `<button class="btn btn-ghost btn-sm" onclick="disconnect(${Number(c.id)})">Remove</button>`,
            })).join('')}</div>` : '<p class="muted">Nothing connected yet.</p>'}
          </div>
          <div class="card">
            <h3>Add an account</h3>
            <p class="hint">You will be sent to the platform to sign in, then brought back here.</p>
            ${available.length ? `<div class="accts">${available.map(pl => `
                <button class="acct" onclick="connect('${esc(pl)}')">
                  <i class="${ICON[pl] || 'fa-solid fa-plus'}"></i>
                  <div><b>Connect ${esc(pl)}</b></div>
                </button>`).join('')}</div>`
              : '<p class="muted">No platforms are configured on the server yet.</p>'}
          </div>`;
    }

    async function connect(platform) {
        try {
            // origin:'web' matters — otherwise the callback hands off to the
            // tapifapp:// deep link, which does nothing in a desktop browser.
            const d = await post('connect-url.php', { platform, origin: 'web' });
            location.href = d.auth_url;
        } catch (e) { alert(e.message); }
    }
    async function disconnect(id) {
        if (!confirm('Remove this account? Scheduled posts to it will not go out.')) return;
        try { await post('disconnect.php', { connection_id: id }); boot(); }
        catch (e) { alert(e.message); }
    }

    /* ── compose ──────────────────────────────────────────────────────── */
    function tabCompose(p) {
        if (!conns.length) {
            p.innerHTML = `<div class="card"><h3>Connect an account first</h3>
                <p class="hint">You need at least one Facebook or Instagram account before you can post.</p>
                <button class="btn" onclick="openTab('accounts')">Go to Accounts</button></div>`;
            return;
        }
        p.innerHTML = `
          <div class="card">
            <h3>Post to</h3>
            <div class="accts">${conns.map(c => acctCard(c, {
                on: !!picked[c.id],
                onclick: `togglePick(${Number(c.id)},this)`,
            })).join('')}</div>

            <label class="lbl" for="cap">Caption</label>
            <textarea class="ta" id="cap" placeholder="What would you like to share?"></textarea>

            <label class="lbl">Photos, video or a reel</label>
            <input type="file" id="file" accept="image/*,video/*" multiple onchange="upload(this)">
            <p class="hint">Pick a video to post a <b>Reel</b> on Instagram or a video post on Facebook.
               Several photos go out as one album.</p>
            <div class="media" id="mediaList"></div>
            <p class="hint" id="igNote" style="margin-top:8px"></p>

            <label class="lbl" for="when">Schedule (optional)</label>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
              <input class="inp" type="datetime-local" id="when">
              <span class="muted">Leave empty to post now.</span>
            </div>

            <div style="margin-top:18px">
              <button class="btn" id="pubBtn" onclick="publish()">Publish</button>
            </div>
            <div id="pubOut" style="margin-top:12px"></div>
          </div>`;
        renderMedia();
    }

    function togglePick(id, el) {
        if (picked[id]) delete picked[id]; else picked[id] = true;
        el.classList.toggle('on');
        renderIgNote();
    }

    function renderMedia() {
        document.getElementById('mediaList').innerHTML = media.map((m, i) => `
            <div class="thumb">
              ${m.type === 'video' ? `<video src="${esc(m.url)}" muted></video>` : `<img src="${esc(m.url)}" alt="">`}
              <button onclick="dropMedia(${i})" title="Remove">&times;</button>
            </div>`).join('');
        renderIgNote();
    }
    function dropMedia(i) { media.splice(i, 1); renderMedia(); }

    /**
     * Say what will actually happen before they press Publish.
     *
     * Instagram rejects a text-only post outright, and a video goes out as a
     * Reel rather than a feed post — both are worth knowing in advance rather
     * than discovering in History.
     */
    function renderIgNote() {
        const note = document.getElementById('igNote');
        if (!note) return;
        const igPicked = conns.some(c => picked[c.id] && c.platform === 'instagram');
        const videos = media.filter(m => m.type === 'video').length;

        let msg = '', warn = true;
        if (igPicked && !media.length) {
            msg = 'Instagram needs at least one photo or video — a text-only post will be rejected.';
        } else if (videos > 1) {
            msg = 'Only the first video is posted; Facebook and Instagram both take one video per post.';
        } else if (videos === 1) {
            msg = igPicked
                ? 'This will go out as a Reel on Instagram and as a video post on Facebook.'
                : 'This will go out as a video post.';
            warn = false;
        }
        note.textContent = msg;
        note.style.color = warn ? '#b45309' : '#15803d';
    }

    async function upload(input) {
        const files = Array.from(input.files || []);
        if (!files.length) return;
        input.disabled = true;
        // media.php takes one file per request, so several are sent in turn
        // rather than as one batch. Videos can be large and the endpoint allows
        // 120s for them, so this is deliberately sequential — firing five big
        // uploads at once is how you get a timeout instead of five posts.
        for (const f of files) {
            try {
                const form = new FormData();
                form.append('file', f);
                // No Content-Type header: the browser must set the multipart boundary.
                const d = await api('media.php', { method: 'POST', body: form });
                media.push({ type: d.type || (f.type.startsWith('video') ? 'video' : 'image'), url: d.url });
                renderMedia();
            } catch (e) {
                alert(f.name + ': ' + e.message);
            }
        }
        input.disabled = false;
        input.value = '';
    }

    async function publish() {
        const caption = (document.getElementById('cap').value || '').trim();
        const ids = Object.keys(picked).map(Number);
        if (!ids.length) { alert('Choose at least one account.'); return; }
        if (!caption && !media.length) { alert('Write a caption or add a photo.'); return; }

        const whenLocal = document.getElementById('when').value;
        // datetime-local gives "YYYY-MM-DDTHH:MM"; the endpoint wants a space
        // and seconds.
        const scheduled_at = whenLocal ? whenLocal.replace('T', ' ') + ':00' : null;

        const btn = document.getElementById('pubBtn');
        btn.disabled = true;
        document.getElementById('pubOut').innerHTML = '<p class="muted">Sending…</p>';
        try {
            await post('publish.php', { caption, media, connection_ids: ids, scheduled_at });
            document.getElementById('pubOut').innerHTML = '<div class="ok">' +
                (scheduled_at ? 'Scheduled.' : 'Published.') + ' Check History for the result on each account.</div>';
            document.getElementById('cap').value = '';
            media = []; renderMedia();
        } catch (e) {
            document.getElementById('pubOut').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
        } finally { btn.disabled = false; }
    }

    /* ── history ──────────────────────────────────────────────────────── */
    async function tabHistory(p) {
        try {
            const d = await api('posts.php?limit=30');
            const rows = d.posts || [];
            p.innerHTML = `<div class="card"><h3>Your posts</h3>
                ${rows.length ? rows.map(r => `
                  <div class="post">
                    <div class="post-top">
                      <span style="font-size:.8rem;color:#6b7280">${esc(r.scheduled_at || r.created_at || '')}</span>
                      <span>${(r.targets || []).map(t => badge(t)).join(' ')}</span>
                    </div>
                    <p class="post-cap">${esc(r.caption || '')}</p>
                  </div>`).join('') : '<p class="muted">Nothing posted yet.</p>'}
            </div>`;
        } catch (e) { p.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
    }
    /**
     * The badge names the ACCOUNT, not just the platform. With a dozen Facebook
     * pages connected, "facebook failed" tells the customer nothing about which
     * one to go and look at — and account_name is already in the payload.
     */
    function badge(t) {
        const s = (t.status || '').toLowerCase();
        const cls = s === 'published' || s === 'sent' ? 'b-ok' : (s === 'failed' ? 'b-bad' : 'b-wait');
        const who = t.account_name || t.platform || '';
        return `<span class="badge ${cls}" title="${esc(t.error || who)}">`
             + `<i class="${ICON[t.platform] || 'fa-solid fa-share-nodes'}"></i> `
             + `${esc(who)} &middot; ${esc(s || 'pending')}</span>`;
    }

    /* ── engagement ───────────────────────────────────────────────────── */
    async function tabStats(p) {
        try {
            const d = await api('engagement.php');
            const t = d.totals || d.total || {};
            p.innerHTML = `<div class="card"><h3>Likes, comments and shares</h3>
                <div class="stat-row">
                  <div class="stat"><b>${esc(t.likes || 0)}</b><span>Likes</span></div>
                  <div class="stat"><b>${esc(t.comments || 0)}</b><span>Comments</span></div>
                  <div class="stat"><b>${esc(t.shares || 0)}</b><span>Shares</span></div>
                </div>
                <p class="hint" style="margin-top:12px">Counted only for posts published through Tapify.</p>
            </div>`;
        } catch (e) { p.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
    }

    document.addEventListener('DOMContentLoaded', boot);
    </script>
</body>
</html>
