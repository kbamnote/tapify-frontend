        .btn-wa { background: #25D366; color: #fff; border: none; padding: 12px 26px; border-radius: 10px; font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; }

    </style>

<script src="../admin.js"></script>

<script>
/* ── WhatsApp for the customer's own number ──────────────────────────────────
   Everything goes through api/whatsapp/proxy.php. The CRM that actually holds
   the inbox is never contacted from the browser — it is private, and the PHP
   session is what authorises us.                                             */
const WA_API      = 'https://app.tapify.co.in/api/whatsapp/proxy.php';
const WA_CONNECT  = 'https://app.tapify.co.in/api/whatsapp/connect.php';
const POLL_MS     = 15000;   // no websocket through the proxy, so poll

let status = null, convos = [], activePhone = null, templates = [], pollTimer = null;

document.addEventListener('DOMContentLoaded', boot);
window.addEventListener('beforeunload', () => clearInterval(pollTimer));

async function api(action, opts = {}) {
    const url = WA_API + '?action=' + encodeURIComponent(action) + (opts.qs || '');
    const res = await fetch(url, {
        method: opts.method || 'GET',
        credentials: 'include',
        headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (res.status === 401) { window.location.href = '../login.html'; throw new Error('auth'); }
    const json = await res.json().catch(() => ({}));
    // The CRM's own error codes (not_connected, window_closed) come through with
    // their status, so callers can react rather than showing a generic failure.
    if (!res.ok) { const e = new Error(json.message || json.error || 'Request failed'); e.code = json.error; e.status = res.status; throw e; }
    return json;
}

async function boot() {
    try {
        status = await api('status');
    } catch (e) {
        return render(`<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>${esc(e.message)}</div>`);
    }
    if (!status.connected) return renderConnect();
    renderInbox();
    await loadConvos();
    pollTimer = setInterval(refresh, POLL_MS);
}

function render(html) { document.getElementById('waRoot').innerHTML = html; }
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

/* ── not connected ─────────────────────────────────────────────────────── */
async function renderConnect() {
    let cfg = { ready: false };
    try { cfg = (await (await fetch(WA_CONNECT, { credentials: 'include' })).json()).data || {}; } catch (_) {}

    render(`
      <div class="wa-connect">
        <div class="wa-icon"><i class="fab fa-whatsapp"></i></div>
        <h2>Connect your WhatsApp number</h2>
        <p>
          Send order confirmations, appointment reminders and enquiry replies from your
          own WhatsApp Business number — automatically. You'll also get a shared inbox
          for everything customers send back.
        </p>
        <button class="btn-wa" id="btnConnect" ${cfg.ready ? '' : 'disabled'}>
          <i class="fab fa-whatsapp"></i> Connect WhatsApp
        </button>
        ${cfg.ready ? '' : '<p style="margin-top:14px;font-size:.82rem;color:#9ca3af">WhatsApp onboarding is not enabled on your account yet. Please contact Tapify support.</p>'}
        <div class="wa-note">
          <strong>Before you start:</strong> the number you connect must <em>not</em> be signed in
          to the normal WhatsApp or WhatsApp Business app. If it is, delete that account
          first (Settings → Account → Delete my account), otherwise verification will fail.
        </div>
      </div>`);

    if (cfg.ready) document.getElementById('btnConnect').addEventListener('click', () => startSignup(cfg));
}

/* Meta Embedded Signup. The popup returns an auth code plus the customer's
   waba_id / phone_number_id; the code is exchanged server-side. */
function startSignup(cfg) {
    const btn = document.getElementById('btnConnect');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Opening…';

    const reset = () => { btn.disabled = false; btn.innerHTML = '<i class="fab fa-whatsapp"></i> Connect WhatsApp'; };
    let signupData = null;

    // Meta posts the selected WABA/phone ids via postMessage, separately from
    // the login callback — so capture them before the callback fires.
    const onMessage = (ev) => {
        if (!/facebook\.com$/.test(new URL(ev.origin).hostname)) return;
        try {
            const d = JSON.parse(ev.data);
            if (d.type === 'WA_EMBEDDED_SIGNUP' && d.event === 'FINISH') signupData = d.data;
        } catch (_) {}
    };
    window.addEventListener('message', onMessage);

    loadFbSdk(cfg).then(() => {
        FB.login((resp) => {
            window.removeEventListener('message', onMessage);
            const code = resp && resp.authResponse && resp.authResponse.code;
            if (!code) { reset(); return; }              // user closed the popup
            if (!signupData || !signupData.waba_id || !signupData.phone_number_id) {
                alert('WhatsApp did not return your account details. Please try again.');
                reset(); return;
            }
            finishSignup(code, signupData, reset);
        }, {
            config_id: cfg.config_id,
            response_type: 'code',
            override_default_response_type: true,
            extras: { setup: {}, featureType: '', sessionInfoVersion: '3' },
        });
    }).catch(() => { alert('Could not load the WhatsApp signup. Please try again.'); reset(); });
}

function loadFbSdk(cfg) {
    return new Promise((resolve, reject) => {
        if (window.FB) return resolve();
        window.fbAsyncInit = function () {
            FB.init({ appId: cfg.app_id, cookie: true, xfbml: false, version: cfg.graph_version || 'v20.0' });
            resolve();
        };
        const s = document.createElement('script');
        s.src = 'https://connect.facebook.net/en_US/sdk.js';
        s.async = true; s.defer = true; s.crossOrigin = 'anonymous';
        s.onerror = reject;
        document.body.appendChild(s);
    });
}

async function finishSignup(code, data, reset) {
    try {
        const res = await fetch(WA_CONNECT, {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, waba_id: data.waba_id, phone_number_id: data.phone_number_id }),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.success === false) throw new Error(json.message || 'Could not connect WhatsApp.');
        boot();                                          // reload into the inbox
    } catch (e) {
        alert(e.message);
        reset();
    }
}

async function disconnect() {
    if (!confirm('Disconnect WhatsApp?\n\nAutomated messages will stop going out from your number. Your conversation history is kept.')) return;
    try {
        await fetch(WA_CONNECT + '?disconnect=1', { method: 'POST', credentials: 'include' });
        clearInterval(pollTimer);
        boot();
    } catch (_) { alert('Could not disconnect.'); }
}

/* ── connected: inbox ──────────────────────────────────────────────────── */
/** The bar shown above whichever view is active. */
function barHtml(view) {
    return `
      <div class="wa-bar">
        <span class="wa-dot"></span>
        <span class="num">${esc(status.displayPhone || 'Connected')}</span>
        <span class="biz">${esc(status.name || '')}</span>
        <span class="spacer"></span>
        <div class="wa-tabs">
          <button class="wa-tab ${view === 'inbox' ? 'active' : ''}" onclick="showInbox()">Inbox</button>
          <button class="wa-tab ${view === 'bot' ? 'active' : ''}" onclick="showBot()">Auto-replies</button>
          <button class="wa-tab ${view === 'bc' ? 'active' : ''}" onclick="showBroadcast()">Broadcast</button>
        </div>
        <button class="btn-ghost" onclick="disconnect()">Disconnect</button>
      </div>`;
}

function renderInbox() {
    render(barHtml('inbox') + `
      <div class="wa-grid">
        <div class="wa-panel">
          <div class="wa-panel-head">Conversations <span id="convoCount" style="color:#9ca3af;font-weight:600"></span></div>
          <div class="wa-list" id="convoList"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Loading…</div></div>
        </div>
        <div class="wa-panel wa-thread-pane" id="threadPane">
          <div class="empty-state" style="margin:auto"><i class="fab fa-whatsapp"></i>Select a conversation</div>
        </div>
      </div>`);
}

function showInbox() {
    clearInterval(pollTimer);
    renderInbox();
    loadConvos();
    pollTimer = setInterval(refresh, POLL_MS);
}

async function loadConvos() {
    try {
        convos = await api('conversations');
    } catch (e) {
        return document.getElementById('convoList').innerHTML =
            `<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>${esc(e.message)}</div>`;
    }
    const list = document.getElementById('convoList');
    if (!list) return;
    document.getElementById('convoCount').textContent = convos.length ? `(${convos.length})` : '';
    if (!convos.length) {
        list.innerHTML = '<div class="empty-state"><i class="far fa-comments"></i>No conversations yet.<br><small>Messages sent from your website will appear here.</small></div>';
        return;
    }
    list.innerHTML = convos.map(c => `
      <div class="wa-convo ${c.phone === activePhone ? 'active' : ''}" onclick="openThread('${esc(c.phone)}')">
        <div class="wa-avatar">${esc((c.name || c.phone || '?').trim().charAt(0).toUpperCase())}</div>
        <div class="wa-convo-main">
          <div class="wa-convo-name">${esc(c.name || c.phone)}</div>
          <div class="wa-convo-last">${c.lastDirection === 'out' ? '<i class="fas fa-reply" style="font-size:.7rem"></i> ' : ''}${esc(c.lastMessage || '')}</div>
        </div>
        ${c.unread ? `<span class="wa-badge">${c.unread}</span>` : ''}
      </div>`).join('');
}

async function openThread(phone) {
    activePhone = phone;
    loadConvos();
    const pane = document.getElementById('threadPane');
    pane.innerHTML = '<div class="empty-state" style="margin:auto"><i class="fas fa-spinner fa-spin"></i>Loading…</div>';

    let msgs = [];
    try { msgs = await api('thread', { qs: '&phone=' + encodeURIComponent(phone) }); }
    catch (e) { pane.innerHTML = `<div class="empty-state" style="margin:auto">${esc(e.message)}</div>`; return; }

    // Free text only delivers within 24h of their last inbound message. Work it
    // out here so the composer can say so BEFORE they type a reply that would
    // be rejected by Meta.
    const lastIn = [...msgs].reverse().find(m => m.direction === 'in');
    const open = lastIn && (Date.now() - new Date(lastIn.createdAt).getTime()) < 24 * 3600 * 1000;

    pane.innerHTML = `
      <div class="wa-panel-head">${esc(msgs[0]?.name || phone)}</div>
      <div class="wa-msgs" id="msgs">${msgs.map(renderMsg).join('') || '<div class="empty-state">No messages</div>'}</div>
      <div class="wa-compose">
        ${open ? '' : `<div class="wa-window">
            <strong>24-hour window closed.</strong> ${esc(msgs[0]?.name || 'This contact')} hasn't messaged you in the
            last 24 hours, so WhatsApp won't deliver a typed reply. Send an approved template instead.
          </div>`}
        ${open ? `
          <textarea id="replyBox" placeholder="Type a reply…"></textarea>
          <div class="wa-compose-row">
            <span style="flex:1"></span>
            <button class="btn-wa" onclick="sendReply()"><i class="fas fa-paper-plane"></i> Send</button>
          </div>`
        : `<div class="wa-compose-row">
            <select class="wa-select" id="tplPick" onchange="renderTplParams()"><option value="">Loading templates…</option></select>
            <button class="btn-wa" onclick="sendTemplate()"><i class="fas fa-paper-plane"></i> Send</button>
          </div>
          <div id="tplPreview" class="wa-tpl-preview"></div>
          <div id="tplParams"></div>`}
      </div>`;

    const box = document.getElementById('msgs');
    if (box) box.scrollTop = box.scrollHeight;
    if (!open) loadTemplates();
}

function renderMsg(m) {
    const t = m.createdAt ? new Date(m.createdAt).toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    const tick = m.direction === 'out'
        ? ({ read: '✓✓', delivered: '✓✓', sent: '✓', queued: '🕓', failed: '⚠' }[m.status] || '')
        : '';
    return `<div class="wa-msg ${m.direction === 'out' ? 'out' : 'in'}">${esc(m.body || '')}
              <div class="wa-meta">${esc(t)} ${tick}</div></div>`;
}

async function loadTemplates() {
    const sel = document.getElementById('tplPick');
    if (!sel) return;
    try {
        templates = await api('templates');
        sel.innerHTML = templates.length
            ? '<option value="">Choose an approved template…</option>' + templates.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')
            : '<option value="">No approved templates yet</option>';
        renderTplParams();
    } catch (_) { sel.innerHTML = '<option value="">Could not load templates</option>'; }
}

async function sendReply() {
    const box = document.getElementById('replyBox');
    const body = (box.value || '').trim();
    if (!body) return;
    box.disabled = true;
    try {
        await api('send', { method: 'POST', body: { phone: activePhone, body } });
        box.value = '';
        openThread(activePhone);
        loadConvos();
    } catch (e) {
        // The server re-checks the window; if it closed while typing, say why.
        alert(e.code === 'window_closed' ? e.message : ('Could not send: ' + e.message));
    } finally { box.disabled = false; }
}

/**
 * Show the chosen template's text, and one input per {{n}} it contains.
 *
 * Without this the send below passed `params: []` for every template. Meta
 * rejects that for any template with a placeholder — which is all of ours — so
 * template sending from this dashboard never actually worked.
 */
function renderTplParams() {
    const sel = document.getElementById('tplPick');
    const prev = document.getElementById('tplPreview');
    const wrap = document.getElementById('tplParams');
    if (!sel || !wrap || !prev) return;
    const t = (templates || []).find(x => x.name === sel.value);
    prev.textContent = t && t.body ? t.body : '';
    const n = (t && t.paramCount) || 0;
    wrap.innerHTML = '';
    for (let i = 1; i <= n; i++) {
        const inp = document.createElement('input');
        inp.className = 'wa-select';
        inp.id = 'tplP' + i;
        inp.placeholder = 'Value for {{' + i + '}}';
        inp.style.cssText = 'width:100%;margin-top:7px';
        wrap.appendChild(inp);
    }
}

async function sendTemplate() {
    const sel = document.getElementById('tplPick');
    const templateName = sel && sel.value;
    if (!templateName) { alert('Choose a template first.'); return; }
    const t = (templates || []).find(x => x.name === templateName);
    const n = (t && t.paramCount) || 0;
    const params = [];
    for (let i = 1; i <= n; i++) {
        const el = document.getElementById('tplP' + i);
        const v = el ? el.value.trim() : '';
        // An empty placeholder fails at Meta with an error the user cannot act
        // on, so stop here where we can say which field is missing.
        if (!v) { alert('Fill in the value for {{' + i + '}} before sending.'); return; }
        params.push(v);
    }
    try {
        await api('send', { method: 'POST', body: { phone: activePhone, templateName, params } });
        openThread(activePhone);
        loadConvos();
    } catch (e) { alert('Could not send: ' + e.message); }
}

/* ── broadcast ─────────────────────────────────────────────────────────── */
/*
 * Bulk template send. TEMPLATES ONLY: free text is deliverable only inside a
 * contact's own 24-hour window, which across a campaign is almost nobody.
 *
 * {{1}} IS ALWAYS THE RECIPIENT'S NAME, filled per person by the server, so the
 * inputs here start at {{2}}. Numbering them from 1 would put every value in
 * the wrong placeholder.
 */
let bcTpls = [], bcTpl = '', bcExtras = [], bcPeople = [], bcPicked = {}, bcRuns = [], bcNote = '', bcErr = false, bcTimer = null;
// Held in state for the same reason the greeting fields are: any re-render
// would otherwise throw away what the customer had pasted but not yet added.
let bcPasteText = '';
const BC_MAX = 500;

async function showBroadcast() {
    clearInterval(pollTimer);
    render(barHtml('bc') + '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Loading…</div>');
    try {
        const [tpl, convos] = await Promise.all([api('templates'), api('conversations')]);
        bcTpls = Array.isArray(tpl) ? tpl : [];
        // Keep anyone imported this session; reloading conversations must not drop them.
        const imported = bcPeople.filter(p => p.imported);
        bcPeople = LeadImport.mergeLeads(Array.isArray(convos) ? convos : [], imported, BC_MAX).contacts;
    } catch (e) {
        return render(barHtml('bc') + `<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>${esc(e.message)}</div>`);
    }
    await loadRuns();
    renderBroadcast();
}

async function loadRuns() {
    try { bcRuns = await api('broadcasts') || []; } catch (_) { /* history is not worth failing over */ }
    clearInterval(bcTimer);
    if (bcRuns.some(r => r.status === 'running')) bcTimer = setInterval(async () => {
        try { bcRuns = await api('broadcasts') || []; renderBroadcast(); } catch (_) {}
        if (!bcRuns.some(r => r.status === 'running')) clearInterval(bcTimer);
    }, 4000);
}

function bcChosen()  { return bcTpls.find(t => t.name === bcTpl); }
function bcNeeded()  { return Math.max(0, ((bcChosen() || {}).paramCount || 0) - 1); }
function bcSelected(){ return bcPeople.filter(p => bcPicked[p.phone]); }

function renderBroadcast() {
    const need = bcNeeded(), sel = bcSelected();
    render(barHtml('bc') + `
      <div class="bot-card">
        <h3>1. Choose a template</h3>
        <p class="sub">Only templates WhatsApp has already approved can be sent to people outside a live conversation.</p>
        ${bcTpls.length ? bcTpls.map(t => `
          <div class="bc-tpl ${t.name === bcTpl ? 'on' : ''}" onclick="bcPickTpl('${esc(t.name)}')">
            <b>${esc(t.name)}</b>
            ${t.body ? `<p>${esc(t.body)}</p>` : ''}
          </div>`).join('') : '<p class="sub">No approved templates yet.</p>'}
        ${need ? `
          <div class="bot-field" style="margin-top:12px">
            <label>Fill the template's blanks</label>
            ${Array.from({length: need}, (_, i) => `
              <input class="bot-input" style="margin-bottom:7px" placeholder="Value for {{${i + 2}}}"
                     value="${esc(bcExtras[i] || '')}" oninput="bcExtras[${i}] = this.value">`).join('')}
            <p class="bot-hint">{{1}} is each person's own name and is filled in for you.</p>
          </div>` : ''}
      </div>

      <div class="bot-card">
        <h3>2. Choose who receives it</h3>
        <p class="sub">People who have messaged you, plus anyone you add. Up to ${BC_MAX} per broadcast.</p>

        <div class="bc-drop">
          <label class="bc-pick">
            Upload Excel or CSV
            <input type="file" accept=".xlsx,.xls,.csv,.tsv,.txt" onchange="bcFile(this)">
          </label>
          <p class="bc-note">A column of numbers is enough. Headings like Name and Phone are understood in any order.</p>
        </div>
        <textarea class="bot-input" id="bcPaste" oninput="bcPasteText = this.value"
                  placeholder="…or paste rows here:&#10;Name,Phone&#10;Abid Khan,9876543210">${esc(bcPasteText)}</textarea>
        <button class="btn-add" style="margin-top:8px" onclick="bcAddPasted()"><i class="fas fa-plus"></i> Add pasted rows</button>
        ${bcNote ? `<p class="bc-note ${bcErr ? 'err' : ''}">${esc(bcNote)}</p>` : ''}

        <div class="bc-head" style="margin-top:14px">
          <button onclick="bcToggleAll()">${sel.length === bcPeople.length && bcPeople.length ? 'Clear selection' : 'Select all'}</button>
          <span>${sel.length} of ${bcPeople.length} selected</span>
        </div>
        ${bcPeople.length ? `<div class="bc-list">${bcPeople.map(p => `
          <label class="bc-row">
            <input type="checkbox" ${bcPicked[p.phone] ? 'checked' : ''} onchange="bcPick('${esc(p.phone)}', this.checked)">
            <span class="nm">${esc(p.name || 'No name')}</span>
            ${p.imported ? '<span class="tag">added</span>' : ''}
            <span class="ph">+${esc(p.phone)}</span>
          </label>`).join('')}</div>`
          : '<p class="sub">Nobody here yet. Upload a list or wait for someone to message you.</p>'}
      </div>

      <div class="bot-save-bar">
        <span class="msg" id="bcMsg"></span>
        <button class="btn-wa" id="bcSend" onclick="bcSend()"><i class="fas fa-paper-plane"></i> Send to ${sel.length}</button>
      </div>

      ${bcRuns.length ? `<div class="bot-card" style="margin-top:16px">
        <h3>Recent broadcasts</h3>
        ${bcRuns.map(r => {
          const done = (r.sent || 0) + (r.failed || 0);
          const pct = r.total ? Math.round(done / r.total * 100) : 0;
          return `<div class="bc-run">
            <div class="bot-item-head"><strong>${esc(r.templateName || '')}</strong><span>${esc(r.status || '')}</span></div>
            <div class="bc-note">${r.sent || 0} sent${r.failed ? ` · ${r.failed} failed` : ''} of ${r.total || 0}</div>
            ${r.status === 'running' ? `<div class="bc-bar"><i style="width:${pct}%"></i></div>` : ''}
          </div>`;
        }).join('')}
      </div>` : ''}`);
}

function bcPickTpl(name) {
    const same = name === bcTpl;
    bcTpl = same ? '' : name;
    bcExtras = same ? [] : new Array(bcNeeded()).fill('');
    renderBroadcast();
}
function bcPick(phone, on) { if (on) bcPicked[phone] = true; else delete bcPicked[phone]; renderBroadcastMsgOnly(); }
function bcToggleAll() {
    if (bcSelected().length === bcPeople.length) bcPicked = {};
    else { bcPicked = {}; bcPeople.slice(0, BC_MAX).forEach(p => { bcPicked[p.phone] = true; }); }
    renderBroadcast();
}
// Ticking one box must not repaint the list, or the scroll position jumps.
function renderBroadcastMsgOnly() {
    const b = document.getElementById('bcSend');
    if (b) b.innerHTML = '<i class="fas fa-paper-plane"></i> Send to ' + bcSelected().length;
}

/** Fold imported people in, tick them, and say what was dropped and why. */
function bcTake(result) {
    const { leads, invalid, duplicates } = result;
    if (!leads.length) {
        bcErr = true;
        bcNote = invalid ? `No usable numbers in those ${invalid} row(s).` : 'Nothing to add.';
        return renderBroadcast();
    }
    const { contacts, added, merged, overflow } = LeadImport.mergeLeads(bcPeople, leads, BC_MAX);
    bcPeople = contacts;
    leads.forEach(l => { if (contacts.some(c => c.phone === l.phone)) bcPicked[l.phone] = true; });
    const bits = [];
    if (added) bits.push(`${added} added`);
    if (merged) bits.push(`${merged} already on the list`);
    if (invalid) bits.push(`${invalid} without a usable number`);
    if (duplicates) bits.push(`${duplicates} repeated`);
    if (overflow) bits.push(`${overflow} over the ${BC_MAX} limit`);
    bcErr = false;
    bcNote = bits.join(' · ');
    bcPasteText = '';                                  // its rows are on the list now
    renderBroadcast();
}

function bcAddPasted() {
    const el = document.getElementById('bcPaste');
    bcPasteText = el ? el.value : bcPasteText;
    bcTake(LeadImport.leadsFromText(bcPasteText));
}

/** SheetJS, fetched only when a real spreadsheet is opened. */
function bcLoadXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload = () => resolve(window.XLSX);
        s.onerror = () => reject(new Error('could not load the spreadsheet reader'));
        document.head.appendChild(s);
    });
}

async function bcFile(input) {
    const file = input.files && input.files[0];
    input.value = '';                                  // so the same file can be re-picked
    if (!file) return;
    const xlsx = /\.(xlsx|xls)$/i.test(file.name);
    try {
        if (!xlsx) {
            // CSV/TSV is text; no library needed.
            return bcTake(LeadImport.leadsFromText(await file.text()));
        }
        const XLSX = await bcLoadXlsx();
        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        // Back to CSV so one parser handles every format — the same one the
        // phone app uses, so an import behaves identically on both.
        bcTake(LeadImport.leadsFromText(XLSX.utils.sheet_to_csv(sheet)));
    } catch (e) {
        bcErr = true;
        bcNote = `Could not read ${file.name}: ${e.message}. Saving it as CSV and uploading that will work.`;
        renderBroadcast();
    }
}

async function bcSend() {
    const msg = document.getElementById('bcMsg'), btn = document.getElementById('bcSend');
    const sel = bcSelected();
    const fail = (t) => { msg.style.color = '#dc2626'; msg.textContent = t; };

    if (!bcTpl) return fail('Choose a template first.');
    if (!sel.length) return fail('Select at least one recipient.');
    if (bcExtras.slice(0, bcNeeded()).some(v => !String(v || '').trim())) return fail('Fill every blank in the template.');
    if (!confirm(`Send "${bcTpl}" to ${sel.length} ${sel.length === 1 ? 'person' : 'people'}?\n\nThis cannot be undone once it starts.`)) return;

    btn.disabled = true; msg.style.color = '#6b7280'; msg.textContent = 'Starting…';
    try {
        await api('broadcast', { method: 'POST', body: {
            templateName: bcTpl,
            params: bcExtras.slice(0, bcNeeded()),
            recipients: sel.map(p => ({ phone: p.phone, name: p.name || '' })),
        }});
        bcPicked = {}; bcTpl = ''; bcExtras = []; bcNote = '';
        await loadRuns();
        renderBroadcast();
        const m = document.getElementById('bcMsg');
        if (m) { m.style.color = '#16a34a'; m.textContent = '✓ Sending has started'; }
    } catch (e) {
        fail(e.message);
        btn.disabled = false;
    }
}

/* ── auto-reply editor ─────────────────────────────────────────────────── */

            ? `<p class="bot-alert">${m.rows.filter(r => (r.title || '').trim() && !botReplyFor(r.title)).length}
                 option(s) have no reply. <button class="btn-link" onclick="botAddMissingReplies()">Create the missing replies</button></p>`

        ${bot.replies.map((r, i) => `

            <div class="bot-item-head">

/**
 * How the bot actually compares a customer's message to a rule.
 *
 * Copied from normalize() in the CRM's whatsappAutoReply.js, which is what
 * decides at run time: punctuation and emoji become spaces, runs of space
 * collapse, then lowercase. Spaces ARE significant ("price list" is not
 * "pricelist") and letters in any script are kept, so a Hindi keyword works.
 * Guessing at this instead of copying it made the badge below lie in both
 * directions — claiming a reply existed when the bot would not match it, and
 * warning about Devanagari options that were answered perfectly well.
 */
function botNorm(s) {
    return String(s == null ? '' : s)
        .replace(/[^\p{L}\p{N}\s]/gu, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
}

/** The keyword rule that answers this menu option, if there is one. */
function botReplyFor(title) {
    const want = botNorm(title);
    if (!want) return null;
    return (bot.replies || []).find(r => botNorm(r.match) === want) || null;
}

/** Add an empty rule for every option that has none, so none is left silent. */
function botAddMissingReplies() {
    (bot.menu.rows || []).forEach(r => {
        const title = (r.title || '').trim();
        if (title && !botReplyFor(title) && bot.replies.length < 50) {
            bot.replies.push({ match: title, reply: '' });
        }
    });
    renderBot();
}

// Edits update state only — renderBot() is NOT called on every keystroke, or the
// field being typed into would lose focus and the caret would jump.
function botRowSet(i, k, v) { bot.menu.rows[i][k] = v; }
function botReplySet(i, k, v) { bot.replies[i][k] = v; }
function botRowAdd()   { if (bot.menu.rows.length < 10) { bot.menu.rows.push({ id: '', title: '', description: '' }); renderBot(); } }
function botRowDel(i)  { bot.menu.rows.splice(i, 1); renderBot(); }
function botReplyAdd() { if (bot.replies.length < 50) { bot.replies.push({ match: '', reply: '' }); renderBot(); } }
function botReplyDel(i){ bot.replies.splice(i, 1); renderBot(); }

async function saveBot() {
    const btn = document.getElementById('botSave');
    const msg = document.getElementById('botMsg');

    bot.enabled = document.getElementById('botEnabled').checked;
    bot.greetingEnabled = document.getElementById('botGreet').checked;
    bot.menu.header = document.getElementById('mHeader').value;
    bot.menu.body = document.getElementById('mBody').value;
    bot.menu.button = document.getElementById('mButton').value;
    // A row's id is what comes back when it's tapped, so it must equal the title.
    bot.menu.rows.forEach(r => { r.id = (r.title || '').trim().toLowerCase(); });

    const blankRow = bot.menu.rows.some(r => !(r.title || '').trim());
    const blankRule = bot.replies.some(r => !(r.match || '').trim() || !(r.reply || '').trim());
    if (blankRow)  { msg.style.color = '#dc2626'; msg.textContent = 'Every menu option needs a title.'; return; }
    if (blankRule) { msg.style.color = '#dc2626'; msg.textContent = 'Every keyword rule needs both a phrase and a reply.'; return; }

    btn.disabled = true; msg.style.color = '#6b7280'; msg.textContent = 'Saving…';
    try {
        bot = await api('bot-save', { method: 'POST', body: bot });
        bot.menu = bot.menu || { rows: [] };
        bot.menu.rows = bot.menu.rows || [];
        bot.replies = bot.replies || [];
        renderBot();
        const m2 = document.getElementById('botMsg');
        m2.style.color = '#16a34a'; m2.textContent = '✓ Saved';
    } catch (e) {
        msg.style.color = '#dc2626'; msg.textContent = e.message;
        btn.disabled = false;
    }
}

/** Poll for new messages; refresh the open thread only if it is still open. */
async function refresh() {
    if (document.hidden) return;          // don't poll a background tab
    await loadConvos();
    if (activePhone) {
        const pane = document.getElementById('threadPane');
        const typing = document.getElementById('replyBox');
        // Never clobber a half-typed reply.
        if (pane && !(typing && typing.value.trim())) openThread(activePhone);
    }
}
