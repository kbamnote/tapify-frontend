<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plans &amp; Pricing - Tapify</title>
    <meta name="description" content="Tapify plans: a website, AI Growth Center, designs and the review funnel from ₹499/month. Pay yearly and save up to 40%.">
    <link rel="icon" type="image/png" href="images/tapify-logo-green.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --ink:#153e3f; --ink2:#264d4e; --gold:#d19a66; --bg:#f6eee6; --muted:#5b7d7e; --line:#e3dad0 }
        *{box-sizing:border-box}
        body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
        .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
        header{padding:22px 0;border-bottom:1px solid var(--line);background:#fff}
        header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
        header img{height:38px}
        header a.back{color:var(--ink);text-decoration:none;font-weight:600;font-size:.92rem}
        .hero{text-align:center;padding:48px 0 10px}
        .hero h1{font-size:2.1rem;margin:0 0 10px;letter-spacing:-.5px}
        .hero p{color:var(--muted);margin:0;font-size1.02rem;line-height:1.6}

        .toggle{display:flex;gap:6px;background:rgba(21,62,63,.07);border-radius:14px;padding:5px;margin:28px auto 6px;max-width:330px}
        .toggle button{flex:1;padding:11px 8px;border:0;background:transparent;border-radius:10px;cursor:pointer;
            font-family:inherit;font-weight:700;font-size:.92rem;color:var(--muted)}
        .toggle button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(21,62,63,.08)}
        .savetag{display:block;font-size:.66rem;color:var(--gold);font-weight:800;letter-spacing:.4px;margin-top:2px}

        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:26px 0 56px}
        .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px;position:relative;display:flex;flex-direction:column}
        .card.feat{border-color:var(--gold);border-width:2px;box-shadow:0 12px 34px rgba(209,154,102,.18)}
        .ribbon{position:absolute;top:0;right:20px;background:var(--gold);color:#fff;font-size:.62rem;font-weight:800;
            letter-spacing:.8px;padding:5px 10px;border-radius:0 0 8px 8px}
        .pname{font-size:1.25rem;font-weight:800;margin:0}
        .blurb{color:var(--muted);font-size:.9rem;line-height:1.55;margin:8px 0 0;min-height:44px}
        .price{display:flex;align-items:baseline;gap:6px;margin-top:18px}
        .price .amt{font-size:2.15rem;font-weight:800;letter-spacing:-1px}
        .price .per{color:var(--muted);font-weight:600;font-size:.95rem}
        .gst{color:var(--muted);font-size:.8rem;margin-top:3px}
        .saving{color:var(--ink2);font-size:.84rem;font-weight:600;margin-top:8px;line-height:1.5}
        .inc{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);flex:1}
        .inc h4{margin:0 0 10px;font-size:.7rem;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
        .inc ul{list-style:none;margin:0;padding:0}
        .inc li{display:flex;gap:9px;font-size:.89rem;line-height:1.5;margin-bottom:7px}
        .inc li i{color:var(--gold);font-size:.78rem;margin-top:4px}
        .buy{margin-top:20px;width:100%;padding:14px;border:0;border-radius:11px;background:var(--ink);color:#fff;
            font-family:inherit;font-weight:800;font-size:1rem;cursor:pointer}
        .buy:disabled{opacity:.55;cursor:default}
        .buy.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
        .cur{margin-top:20px;padding:13px;border-radius:11px;text-align:center;font-weight:800;font-size:.88rem;
            background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.32);color:#157f3c}
        .notice{max-width:760px;margin:0 auto;padding:14px 16px;border-radius:12px;font-size:.9rem;line-height:1.55}
        .n-info{background:rgba(21,62,63,.07);border:1px solid rgba(21,62,63,.18)}
        .n-ok{background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.32);color:#157f3c}
        .n-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.34);color:#b42318}
        .foot{color:var(--muted);font-size:.82rem;line-height:1.6;text-align:center;padding:0 0 50px}
        .spin{text-align:center;padding:60px 0;color:var(--muted)}
        @media(max-width:600px){ .hero h1{font-size:1.7rem} }
    </style>
</head>
<body>

<header>
    <div class="wrap">
        <a href="/"><img src="images/tapify-logo-green.png" alt="Tapify"></a>
        <a class="back" href="/dashboard/dashboard"><i class="fas fa-arrow-left"></i> My account</a>
    </div>
</header>

<div class="wrap">
    <div class="hero">
        <h1>Choose your plan</h1>
        <p>Everything you need to get your business online — and keep it growing.</p>
    </div>

    <div id="notice"></div>

    <div class="toggle" id="toggle">
        <button data-cycle="monthly">Monthly</button>
        <button data-cycle="yearly" class="on">Yearly<span class="savetag">SAVE UP TO 40%</span></button>
    </div>

    <div id="grid" class="grid"><div class="spin">Loading plans…</div></div>

    <p class="foot">
        Prices exclude 18% GST, which is added at checkout.<br>
        Ad spend and WhatsApp messages are paid from your Tapify wallet and are not included in the plan fee.
    </p>
</div>

<script>
/**
 * Public pricing + checkout.
 *
 * This page is the ONLY checkout route on iOS: the app has already been
 * rejected once under Apple Guideline 3.1.1 for buying digital credit through
 * a gateway in-app, so the app opens this page in the browser instead of
 * selling anything itself. See tapify-app/src/config/plans.js.
 *
 * It needs a signed-in session, because /api/plans/checkout.php prices the
 * plan server-side against the logged-in user. The amount is never sent from
 * here — a client that could name its own price could buy a year of Pro for a
 * rupee.
 */
const API    = 'https://app.tapify.co.in';
const LIST   = API + '/api/plans/list.php';
const BUY    = API + '/api/plans/checkout.php';

let cycle = 'yearly';
let plans = [];
let current = null;

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const qs = new URLSearchParams(location.search);

function notice(kind, html) {
    document.getElementById('notice').innerHTML =
        `<div class="notice n-${kind}" style="margin-bottom:6px">${html}</div>`;
}

/* The customer is back from the gateway. The status in this URL came through
   their own browser, so it is a hint for the wording only — the plan was
   already activated (or not) server-side by easebuzz-return.php, which asked
   Easebuzz directly. Re-reading the plan below is what actually confirms it. */
if (qs.has('paid')) {
    const s = qs.get('paid');
    if (s === 'success')      notice('ok',  '<strong>Payment received.</strong> Your plan is active — open the Tapify app to use it.');
    else if (s === 'pending') notice('info','<strong>Payment pending.</strong> Your bank has not confirmed it yet. This page will show your plan once it does.');
    else                      notice('err', '<strong>Payment not completed.</strong> No money has been deducted. You can try again below.');
}

async function load() {
    try {
        const r = await fetch(LIST, { credentials: 'include' });
        const j = await r.json();
        plans   = (j.data && j.data.plans) || [];
        current = (j.data && j.data.current) || null;
        render();
    } catch (e) {
        document.getElementById('grid').innerHTML =
            '<div class="spin">Could not load plans. Please refresh.</div>';
    }
}

function render() {
    const rank = { free:0, starter:1, growth:2, pro:3 };
    const curRank = current ? (rank[current.code] || 0) : 0;
    const highlight = qs.get('plan');

    // A grandfathered customer has nothing to buy, and offering them a Buy
    // button would only produce a refusal from the server.
    if (current && current.legacy) {
        notice('ok', '<strong>You already have full access.</strong> As an existing Tapify customer every feature is unlocked on your account — there is no plan to buy.');
    }

    document.getElementById('grid').innerHTML = plans.map(p => {
        const price = cycle === 'yearly' ? p.yearly : p.monthly;
        const isCur = current && current.code === p.code && !current.legacy;
        const down  = (rank[p.code] || 0) < curRank && !(current && current.legacy);
        const feat  = highlight ? p.code === highlight : p.code === 'growth';

        const items = (p.includes || []).map(x =>
            `<li><i class="fas fa-check"></i><span>${esc(x)}</span></li>`).join('');

        let action;
        if (current && current.legacy) {
            action = '<div class="cur">Full access — nothing to buy</div>';
        } else if (isCur) {
            action = `<div class="cur">Your current plan${
                (current.days_left !== null && current.days_left !== undefined)
                    ? ` · ${current.days_left} day${current.days_left === 1 ? '' : 's'} left` : ''}</div>`;
        } else {
            action = `<button class="buy${down ? ' ghost' : ''}" onclick="buy('${esc(p.code)}')">
                        ${down ? 'Switch to ' + esc(p.name) : 'Choose ' + esc(p.name)}</button>`;
        }

        return `
        <div class="card${feat ? ' feat' : ''}">
            ${feat ? `<div class="ribbon">${highlight === p.code ? 'UNLOCKS WHAT YOU WANTED' : 'MOST POPULAR'}</div>` : ''}
            <h3 class="pname">${esc(p.name)}</h3>
            <p class="blurb">${esc(p.blurb || '')}</p>
            <div class="price">
                <span class="amt">₹${esc(price.base)}</span>
                <span class="per">${cycle === 'yearly' ? '/year' : '/month'}</span>
            </div>
            <div class="gst">₹${esc(price.total)} including ${esc(p.gst_pct)}% GST</div>
            ${cycle === 'yearly' ? `<div class="saving">One payment · works out to ₹${esc(p.yearly.per_month)}/month<br>
                You save ₹${esc(p.yearly.saving)} (${esc(p.yearly.discount_pct)}% off ₹${esc(p.yearly.list_base)})</div>` : ''}
            <div class="inc">
                <h4>${p.inherits ? 'Everything in ' + esc(p.inherits) + ', plus' : "What's included"}</h4>
                <ul>${items}</ul>
            </div>
            ${action}
        </div>`;
    }).join('');
}

async function buy(code) {
    document.querySelectorAll('.buy').forEach(b => { b.disabled = true; });
    notice('info', 'Opening the secure payment page…');
    try {
        const r = await fetch(BUY, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            // `web: true` so the gateway returns the customer to THIS page
            // afterwards instead of trying a tapifapp:// deep link, which does
            // nothing in a browser.
            body: JSON.stringify({ plan: code, cycle: cycle, web: true })
        });

        // Not signed in: the only way to price a plan is against a real
        // account, so send them to log in and come straight back.
        if (r.status === 401) {
            location.href = '/login?next=' + encodeURIComponent('/plans?plan=' + code);
            return;
        }

        const j = await r.json();
        if (!j.success || !(j.data && j.data.payment_url)) {
            throw new Error(j.message || 'Could not start the payment.');
        }
        location.href = j.data.payment_url;
    } catch (e) {
        notice('err', esc(e.message || 'Could not start the payment.')
            + ' If this keeps happening, message us on WhatsApp and we will activate it for you.');
        document.querySelectorAll('.buy').forEach(b => { b.disabled = false; });
    }
}

document.getElementById('toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-cycle]');
    if (!btn) return;
    cycle = btn.dataset.cycle;
    document.querySelectorAll('#toggle button').forEach(b => b.classList.toggle('on', b === btn));
    render();
});

load();
</script>
</body>
</html>
